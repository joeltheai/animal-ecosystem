      if (this.vy >= 0 && prevBottom <= p.y + 0.75 && newBottom >= p.y - 0.1) {
        if (!supportPlatform || p.y < supportPlatform.y) supportPlatform = p;
      }
    }
    if (supportPlatform) floor = supportPlatform.y;

    this.wasGrounded = this.onGround;
    const impact = this.vy;
    if (newBottom >= floor) {
      this.y = floor - this.ride;
      this.vy = 0;
      this.onGround = true;
      this.support = supportPlatform ? { kind: 'platform', p: supportPlatform } : { kind: 'ground' };
      this.floorY = floor;

      if (!this.wasGrounded) {
        this.landedThisTick = true;
        const strength = clamp(impact / 620, 0.08, 1.25);
        this.squash = Math.max(this.squash, strength);
        this.squashVel = -1.1 * strength;
        this.flail = 0;
        this.airMeter = 0;
        if (impact > 120) {
          spawnDust(this.x, floor, 3 + Math.floor(strength * 6), 0.7 + strength, true);
          spawnSplash(this.x, floor, 2 + Math.floor(strength * 4), 0.5 + strength * 0.7);
          if (impact > 260) {
            if (this.isPlayer) {
              cam.shake = Math.min(8, cam.shake + strength * 4.5);
              audio.land(strength * 1.1);
            }
          }
        }
        for (const leg of this.legs) {
          leg.step = null;
          leg.cooldown = 0;
        }
        for (const ear of this.ears) ear.vel += strength * 2;
      }
    } else {
      if (this.wasGrounded) {
        this.coyote = 0.1;
        this.airMeter = 0.1;
      }
      this.onGround = false;
      this.support = null;
      this.floorY = floor;
    }

    // stick to gentle downhill ground instead of micro-hopping down every slope
    if (!this.onGround && this.wasGrounded && this.vy >= 0 && !supportPlatform) {
      const gap = floor - (this.y + this.ride);
      if (gap > 0 && gap < 7 * s) {
        this.y = floor - this.ride;
        this.vy = 0;
        this.onGround = true;
        this.support = { kind: 'ground' };
        this.floorY = floor;
        this.coyote = 0;
      }
    }

    // air-time flailing, as described in the rain world devlog:
    // it accumulates with time in the air and speed, not with a timer.
    if (!this.onGround) {
      this.airMeter += dt * (0.75 + Math.abs(this.vx) / 175 + Math.abs(this.vy) / 520);
    } else {
      this.airMeter = Math.max(0, this.airMeter - dt * 5);
    }
    this.flail = damp(this.flail, smoothstep(clamp((this.airMeter - 1.15) / 1.3, 0, 1)), 8, dt);

    // state smoothing
    this.act = damp(this.act, clamp(Math.abs(this.vx) / runSpeed, 0, 1), 8, dt);
    const still = this.onGround && Math.abs(this.vx) < 7 && move === 0;
    if (still) this.idleTimer += dt; else this.idleTimer = 0;
    let idleTarget = smoothstep(clamp((this.idleTimer - 0.22) / 0.55, 0, 1));
    if (this.sliding || this.crouch > 0.3) idleTarget = 0;
    this.idleBlend = damp(this.idleBlend, idleTarget, 7, dt);

    // occasional wet shiver
    this.shakeIn -= dt;
    if (this.shakeIn <= 0) {
      this.shakeIn = 7 + Math.random() * 9;
      if (this.onGround && Math.abs(this.vx) < 9 && this.idleBlend > 0.45) {
        this.shakeT = 0.42;
        this.shakeDust = 0;
        for (const ear of this.ears) {
          ear.vel += (Math.random() < 0.5 ? -1 : 1) * (1.4 + Math.random() * 1.6);
        }
      }
    }
    if (this.shakeT > 0) {
      this.shakeT = Math.max(0, this.shakeT - dt);
      this.shakeDust -= dt;
      if (this.shakeDust <= 0) {
        this.shakeDust = 0.055;
        for (let i = 0; i < 2; i++) {
          particles.push({
            kind: 'drop',
            x: this.x + rand(-12, 12) * this.s,
            y: this.y + rand(-12, 2) * this.s,
            vx: rand(-60, 60),
            vy: rand(-90, -20),
            life: rand(0.25, 0.45),
            max: 0.45,
            r: rand(0.5, 1.1),
            wet: true,
          });
        }
      }
    }

    const standTarget = this.sliding ? 0 : this.onGround ? (1 - this.crouch * 0.8) : 0.16;
    this.standBlend = damp(this.standBlend, standTarget, this.onGround ? 10 : 6, dt);
    this.bobVel += (-this.bob * 160 - this.bobVel * 18) * dt;
    this.bob = clamp(this.bob + this.bobVel * dt, -3, 3);

    this.wigglePhase += dt * (1.6 + Math.abs(this.vx) * 0.062);

    // squash spring
    this.squashVel += (-this.squash * 95 - this.squashVel * 12.5) * dt;
    this.squash += this.squashVel * dt;
    this.squash = clamp(this.squash, -0.32, 1.0);

    // sliding debris
    if (this.sliding && this.onGround && Math.abs(this.vx) > 45) {
      this.slideDust -= dt;
      if (this.slideDust <= 0) {
        this.slideDust = 0.055;
        spawnDust(this.x - this.facing * 12 * s, this.floorY, 1, 0.55, true);
        if (Math.random() < 0.5) spawnSplash(this.x - this.facing * 9 * s, this.floorY, 1, 0.5);
      }
    }

    // sprint steps kick up a little spray
    if (this.onGround && ctrl.sprint && Math.abs(this.vx) > walkSpeed) {
      this.dustTimer -= dt;
      if (this.dustTimer <= 0) {
        this.dustTimer = 0.11;
        spawnDust(this.x - this.facing * 10 * s, this.floorY, 1, 0.45, true);
      }
    }

    // trail, pose, limbs, tail, face
    this.updateHistory(dt);
    this.updateSpine(dt);
    this.updateLegs(dt);
    this.updateTail(dt);
    this.updateFace(dt);

    if (this.isPlayer && this.y > 900) this.reset(this.spawnX);
  }

  updateHistory(dt) {
    const h = this.history;
    const last = h[h.length - 1];
    if (!last || Math.hypot(this.x - last.x, this.y - last.y) > 0.42) {
      h.push({ x: this.x, y: this.y });
      let total = 0;
      for (let i = h.length - 1; i > 0; i--) {
        total += Math.hypot(h[i].x - h[i - 1].x, h[i].y - h[i - 1].y);
        if (total > 190) {
          h.splice(0, i);
          break;
        }
      }
      if (h.length > 420) h.splice(0, h.length - 320);
    }
  }

  // distance is measured backwards from the current root position
  samplePath(dist) {
    if (dist <= 0) {
      return { x: this.x + this.facing * (-dist), y: this.y };
    }
    const h = this.history;
    let px = this.x, py = this.y;
    let remaining = dist;
    for (let i = h.length - 1; i >= 0; i--) {
      const q = h[i];
      const seg = Math.hypot(q.x - px, q.y - py);
      if (seg < 0.0001) continue;
      if (remaining <= seg) {
        const t = remaining / seg;
        return { x: lerp(px, q.x, t), y: lerp(py, q.y, t) };
      }
      remaining -= seg;
      px = q.x;
      py = q.y;
    }
    return { x: px - this.facing * remaining, y: py };
  }

  // ---------------------------------------------------------------- spine

  updateSpine(dt) {
    const s = this.s;
    const N = this.N;
    const idle = this.idleBlend;
    const points = [];

    for (let i = 0; i < N; i++) {
      const d = (-6.2 + i * this.spacing / s) * s;
      const p = this.samplePath(d);
      points.push(p);
    }

    // ripple along the body while moving
    for (let i = 0; i < N; i++) {
      const a = points[Math.max(0, i - 1)];
      const b = points[Math.min(N - 1, i + 1)];
      const tx = b.x - a.x, ty = b.y - a.y;
      const tl = Math.hypot(tx, ty) || 1;
      const nx = -ty / tl, ny = tx / tl;
      const wave = Math.sin(this.wigglePhase - i * 0.82);
      const amp = (0.25 + this.act * 1.1 + this.flail * 0.7) * (1 - this.standBlend * 0.7);
      const lateral = wave * amp * (0.35 + (i / (N - 1)) * 0.8);
      points[i].x += nx * lateral;
      points[i].y += ny * lateral;

      // gentle arch
      points[i].y -= Math.sin(Math.PI * i / (N - 1)) * (0.8 + this.act * 1.0) * (1 - idle);
    }

    // the standing / scurrying pose. hips are low, chest is high,
    // and the whole body leans further forward as speed builds.
    const stand = this.standBlend;
    const lean = smoothstep(clamp(this.act * 1.15, 0, 1));
    if (stand > 0.001) {
      const breath = Math.sin(this.t * 2.05) * 0.32;
      const settle = Math.sin(this.t * 0.73) * 0.2 * (1 - lean);
      const neckX = lerp(4.5, 7.5, lean);
      const neckY = lerp(-13.5, -11.2, lean);
      const rumpX = lerp(-8.5, -6.0, lean);
      const rumpY = lerp(3.5, 3.8, lean);
      const arch = lerp(2.4, 2.8, lean);
      for (let i = 0; i < N; i++) {
        const u = i / (N - 1);
        const gaitWave = Math.sin(this.wigglePhase * 0.52 + u * 2.7 + 0.6) * (0.3 + lean * 0.7) * (1 - u);
        const lx = lerp(neckX, rumpX, u) + settle * (0.3 + u) + gaitWave;
        let ly = lerp(neckY, rumpY, u) - Math.sin(u * Math.PI) * arch - breath * (1 - u * 0.7);
        ly += this.bob * (0.35 + u * 0.65);
        const ix = this.x + this.facing * lx * s;
        const iy = this.y + ly * s;
        points[i].x = lerp(points[i].x, ix, stand);
        points[i].y = lerp(points[i].y, iy, stand);
      }
    }

    // cosmetic shiver — water shaken out of the fur
    if (this.shakeT > 0) {
      const amp = (this.shakeT / 0.42) * 1.7 * s;
      for (let i = 0; i < N; i++) {
        const u = i / (N - 1);
        points[i].x += Math.sin(this.t * 68 + i * 1.9) * amp * (0.25 + u * 0.75);
        points[i].y += Math.cos(this.t * 61 + i * 1.5) * amp * 0.35;
      }
    }

    // crouch / slide flattening
    const low = Math.max(this.crouch, this.sliding ? 1 : 0);
    if (low > 0.001) {
      for (let i = 0; i < N; i++) {
        const u = i / (N - 1);
        points[i].y += low * (1.3 + u * 2.4) * s;
        points[i].x -= this.facing * low * (u - 0.5) * 2.4 * s;
      }
    }

    // keep the body from sinking through the floor on steep ground
    for (let i = 0; i < N; i++) {
      const minY = groundY(points[i].x) - this.radii[i] - 0.8 * s;
      if (points[i].y > minY) points[i].y = minY;
    }

    this.spine = points;

    // head target: a little forward of the neck, with a light spring
    const neck = points[0];
    const trailLift = 9.0 - idle * 4.6;
    const standLift = 4.6 + lean * 0.6;
    const headLift = lerp(trailLift, standLift, stand);
    const targetHX = neck.x + this.facing * 4.6 * s;
    const targetHY = neck.y - (headLift + this.crouch * 1.4) * s;
    this.head.x = damp(this.head.x, targetHX, 29, dt);
    this.head.y = damp(this.head.y, targetHY, 25, dt);
    const hdx = this.head.x - targetHX;
    const hdy = this.head.y - targetHY;
    const hDist = Math.hypot(hdx, hdy);
    const hMax = 3.4 * s;
    if (hDist > hMax) {
      this.head.x = targetHX + hdx / hDist * hMax;
      this.head.y = targetHY + hdy / hDist * hMax;
    }

    const bodyTilt = Math.atan2(
      (points[0].y - points[2].y) * this.facing,
      Math.max(4, Math.abs(points[0].x - points[2].x))
    );
    const localLookX = (this.look.x - this.head.x) * this.facing;
    const localLookY = this.look.y - this.head.y;
    const lookPitch = clamp(Math.atan2(localLookY, Math.max(14, Math.abs(localLookX))) * 0.6, -0.33, 0.3);
    const airPitch = this.onGround ? 0 : clamp(-this.vy * 0.00055, -0.22, 0.2);
    this.headTilt = clamp(
      bodyTilt * 0.34 + lookPitch * 0.55 + airPitch - idle * 0.09 - (1 - idle) * 0.08,
      -0.48, 0.42
    );

    this.gazeX = damp(this.gazeX, clamp(localLookX / 42, -1, 1), 10, dt);
    this.gazeY = damp(this.gazeY, clamp(localLookY / 38, -1, 1), 10, dt);
  }

  // ----------------------------------------------------------------- legs

  updateLegs(dt) {
    const speed = Math.abs(this.vx);
    for (const leg of this.legs) {
      this.updateLeg(leg, dt, speed);
    }
  }

  updateLeg(leg, dt, speed) {
    const s = this.s;
    const anchor = this.legAnchor(leg);
    leg.hip = anchor;
    leg.cooldown = Math.max(0, leg.cooldown - dt);

    // standing / scurrying posture: the arms swing free in front,
    // the two hind legs carry the gait.
    if (this.onGround && !this.sliding && this.standBlend > 0.3) {
      if (leg.front) {
        const swing = Math.sin(this.wigglePhase * 0.9 + (leg.far ? Math.PI : 0));
        const breathe = Math.sin(this.t * 2.05 + (leg.far ? 1.1 : 0)) * 0.3;
        const tx = anchor.x + this.facing * ((leg.far ? 3.5 : 7.0) + swing * (0.5 + this.act * 4.2)) * s;
        const ty = anchor.y + (15.5 - this.act * 1.0 + breathe - clamp(this.squash, 0, 1) * 3.4) * s;
        leg.foot.x = damp(leg.foot.x, tx, 11, dt);
        leg.foot.y = damp(leg.foot.y, ty, 11, dt);
        leg.footAngle = damp(leg.footAngle, -0.12 + swing * 0.12, 6, dt);
        leg.step = null;
        this.solveLeg(leg);
        return;
      } else if (this.idleBlend > 0.55 && speed < 12) {
        // settle the hind feet under the hips while resting
        const tx = anchor.x + this.facing * (leg.far ? -3.6 : -1.5) * s;
        const ty = this.surfaceAt(tx) - 0.5 * s;
        leg.foot.x = damp(leg.foot.x, tx, 7, dt);
        leg.foot.y = damp(leg.foot.y, ty, 10, dt);
        leg.footAngle = Math.atan2(groundY(leg.foot.x + 2) - groundY(leg.foot.x - 2), 4);
        leg.step = null;
        this.solveLeg(leg);
        return;
      }
    }

    if (!this.onGround || this.sliding || this.landedThisTick) {
      if (this.landedThisTick) {
        leg.step = null;
        const fx = anchor.x + this.facing * (leg.front ? 2.0 : -1.5) * s;
        leg.foot.x = fx;
        leg.foot.y = this.surfaceAt(fx) - 0.5 * s;
        leg.footAngle = Math.atan2(
          groundY(leg.foot.x + 2) - groundY(leg.foot.x - 2), 4
        );
      }
    }

    if (!this.onGround) {
      // tuck the limbs; if we have been falling for long, start reaching
      leg.step = null;
      const flail = this.flail;
      const osc = Math.sin(this.t * 8.5 + leg.anchor * 2 + (leg.far ? 2.2 : 0));
      let tx, ty;
      if (leg.front) {
        tx = anchor.x + this.facing * (2.8 + flail * (3.2 + osc * 4.6)) * s;
        ty = anchor.y + (5.2 + flail * (7.0 + Math.cos(this.t * 7.2 + leg.anchor) * 4.0)) * s;
        if (flail > 0.05) {
          // look for a floor in front/below, just like the arms in the devlog
          const probeX = anchor.x + this.facing * (8 + flail * 12) * s;
          const fy = this.surfaceAt(probeX);
          if (fy - anchor.y < (leg.l1 + leg.l2) * 0.96) {
            tx = lerp(tx, probeX, flail * 0.75);
            ty = lerp(ty, fy - 1, flail * 0.8);
          }
        }
      } else {
        tx = anchor.x - this.facing * (3.6 + flail * (4.0 - osc * 3.8)) * s;
        ty = anchor.y + (6.5 + flail * (5.5 + osc * 3.4)) * s;
      }
      leg.foot.x = damp(leg.foot.x, tx, 10, dt);
      leg.foot.y = damp(leg.foot.y, ty, 10, dt);
      leg.footAngle = damp(leg.footAngle, 0, 6, dt);
    } else if (this.sliding) {
      // hands forward, hind feet trailing, belly on the ground
      leg.step = null;
      const tx = anchor.x + this.facing * (leg.front ? 8.5 : -7.5) * s;
      leg.foot.x = damp(leg.foot.x, tx, 16, dt);
      leg.foot.y = damp(leg.foot.y, this.surfaceAt(leg.foot.x) - 0.3, 18, dt);
      leg.footAngle = Math.atan2(groundY(leg.foot.x + 2) - groundY(leg.foot.x - 2), 4);
    } else {
      // grounded walk / trot
      const stride = clamp(speed * 0.04, 0, 6) * s;
      const homeX = anchor.x + this.facing * ((leg.front ? 2.2 : -1.6) * s + stride * (leg.front ? 0.4 : 0.2));
      const homeY = this.surfaceAt(homeX) - 0.5 * s;
      const threshold = (4.8 + speed * 0.02) * s;
      const err = Math.hypot(leg.foot.x - homeX, (leg.foot.y - homeY) * 0.75);

      if (leg.step) {
        leg.step.t += dt;
        const k = clamp(leg.step.t / leg.step.dur, 0, 1);
        const e = k * k * (3 - 2 * k);
        leg.foot.x = lerp(leg.step.from.x, leg.step.to.x, e);
        leg.foot.y = lerp(leg.step.from.y, leg.step.to.y, e) - Math.sin(Math.PI * k) * leg.step.lift;
        leg.footAngle = lerp(leg.step.fromAngle, leg.step.toAngle, e);
        if (k >= 1) {
          leg.foot.x = leg.step.to.x;
          leg.foot.y = leg.step.to.y;
          leg.footAngle = leg.step.toAngle;
          leg.step = null;
          leg.cooldown = 0.015 + Math.random() * 0.03;
          this.bobVel -= 0.45 + this.act * 0.7;
          spawnDust(leg.foot.x, this.surfaceAt(leg.foot.x), 1, 0.3 + speed / 350, true);
          if (this.isPlayer && speed > 30) audio.step(0.4 + speed / 320, true);
        }
      } else {
        // keep a planted diagonal pair on the ground: the whole ride
        // should never be airborne in a normal run.
        const otherPairBusy = this.legs.some(o => o.pair !== leg.pair && o.step);
        if (leg.cooldown <= 0 && err > threshold && !otherPairBusy && speed > 2) {
          this.startStep(leg, Math.hypot(leg.foot.x - homeX, leg.foot.y - homeY));
        }
      }
    }

    this.solveLeg(leg);
  }

  startStep(leg, distance) {
    if (leg.step) return;
    const s = this.s;
    const anchor = this.legAnchor(leg);
    const speed = Math.abs(this.vx);
    const dur = clamp(0.22 - speed * 0.00085, 0.075, 0.18);
    const predicted = speed * dur;
    const maxReach = (leg.l1 + leg.l2) * 0.92;

    const baseAhead = (leg.front ? 3.0 : 0.5) * s + predicted * 0.85;
    let tx = anchor.x + this.facing * baseAhead;
    let ty = this.surfaceAt(tx) - 0.5 * s;
    let dy = ty - anchor.y;
    const maxX = Math.sqrt(Math.max(0, maxReach * maxReach - dy * dy));
    if (Math.abs(tx - anchor.x) > maxX) {
      tx = anchor.x + this.facing * maxX;
      ty = this.surfaceAt(tx) - 0.5 * s;
    }

    const toAngle = Math.atan2(groundY(tx + 2) - groundY(tx - 2), 4);
    leg.step = {
      from: { x: leg.foot.x, y: leg.foot.y },
      to: { x: tx, y: ty },
      fromAngle: leg.footAngle,
      toAngle,
      t: 0,
      dur,
      lift: (2.5 + Math.min(9, distance * 0.35) + this.act * 1.2) * s,
    };
    leg.cooldown = 0.02 + Math.random() * 0.025;
  }

  solveLegs() {
    for (const leg of this.legs) this.solveLeg(leg);
  }

  solveLeg(leg) {
    const bendWorld = (leg.front ? 1 : -1) * this.facing;
    const res = solveIK(
      leg.hip.x, leg.hip.y,
      leg.foot.x, leg.foot.y,
      leg.l1, leg.l2,
      bendWorld
    );
    leg.knee = res.knee;
    leg.ikFoot = res.foot;
  }

  // ----------------------------------------------------------------- tail

  updateTail(dt) {
    const s = this.s;
    const base = this.spine[this.N - 1];
    const t = this.tail;
    const anchorX = base.x - this.facing * 1.8 * s;
    const anchorY = base.y + 0.6 * s;

    t[0].x = anchorX;
    t[0].y = anchorY;
    t[0].px = anchorX;
    t[0].py = anchorY;

    const idle = this.idleBlend;
    const speed = Math.abs(this.vx);
    const retain = Math.pow(0.5, dt);
    const dt2 = dt * dt;

    for (let i = 1; i < this.tailLen; i++) {
      const n = t[i];
      const vx = (n.x - n.px) * retain;
      const vy = (n.y - n.py) * retain;
      n.px = n.x;
      n.py = n.y;

      const gravityT = (this.onGround ? 480 : 120) * s;
      const lift = (this.onGround ? speed * 2.9 + 40 : speed * 0.8) * s * (i / this.tailLen);
      const windAcc = (worldTime.wind || 0) * 0.35 * s;
      const curl = idle * Math.pow(i / this.tailLen, 1.3);

      n.x += vx + (windAcc + Math.sin(this.t * 1.1 + i * 0.62) * 50 * s * curl) * dt2;
      n.y += vy + (gravityT - lift - 80 * s * curl) * dt2;

      // a lazy wag while trotting
      n.x += Math.sin(this.wigglePhase * 0.55 + i * 0.8) * (0.02 + speed * 0.00022) * s * (i / this.tailLen);
      // a little idle curl in the last third
      n.x += Math.sin(this.t * 1.05 + i * 0.7) * 0.055 * s * curl;
      n.y -= 0.035 * s * curl;

      // never let the tail drag through the floor
      const fy = this.surfaceAt(n.x) - this.tailRadii[i] * 0.55;
      if (n.y > fy) {
        n.y = fy;
        n.px = lerp(n.px, n.x, 0.4);
        n.py = lerp(n.py, n.y, 0.4);
      }
    }

    // in the upright rest pose the tail settles into a long,
    // ground-skimming curl instead of hanging dead straight.
    if (idle > 0.01) {
      const b = this.spine[this.N - 1];
      const dir = -this.facing;
      for (let i = 1; i < this.tailLen; i++) {
        const n = t[i];
        const tx = b.x + dir * (i * this.tailSeg - 1.2 * s)
          + Math.sin(this.t * 0.85 + i * 0.55) * 1.2 * s * idle;
        const lift = i >= 4
          ? smoothstep((i - 4) / (this.tailLen - 5)) * 20.5 * s
          : 0;
        let ty = b.y + 1.1 * s + i * 1.55 * s - lift
          + Math.sin(this.t * 1.2 + i * 0.7) * 0.55 * s;
        const fy = this.surfaceAt(tx) - this.tailRadii[i] * 0.65;
        ty = Math.min(ty, fy);
        const k = 0.05 * idle * (0.45 + i / this.tailLen);
        n.x = lerp(n.x, tx, k);
        n.y = lerp(n.y, ty, k);
        n.px = lerp(n.px, n.x, 0.55);
        n.py = lerp(n.py, n.y, 0.55);
      }
    }

    // constraints with a stiffness that fades toward the tip
    for (let iter = 0; iter < 3; iter++) {
      for (let i = 1; i < this.tailLen; i++) {
        const a = t[i - 1], b = t[i];
        let dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.0001;
        const diff = (d - this.tailSeg) / d;
        if (i === 1) {
          b.x -= dx * diff; b.y -= dy * diff;
        } else {
          a.x += dx * diff * 0.5; a.y += dy * diff * 0.5;
          b.x -= dx * diff * 0.5; b.y -= dy * diff * 0.5;
        }
      }
      for (let i = 1; i < this.tailLen - 1; i++) {
        const a = t[i - 1], b = t[i], c = t[i + 1];
        const k = 0.14 * (1 - i / this.tailLen);
        b.x += ((a.x + c.x) * 0.5 - b.x) * k;
        b.y += ((a.y + c.y) * 0.5 - b.y) * k;
      }
      for (let i = 1; i < this.tailLen; i++) {
        const n = t[i];
        const fy = this.surfaceAt(n.x) - this.tailRadii[i] * 0.55;
        if (n.y > fy) n.y = fy;
      }
    }

    t[0].x = anchorX;
    t[0].y = anchorY;
  }

  // ----------------------------------------------------------------- face

  updateFace(dt) {
    this.blinkIn -= dt;
    if (this.blinkIn <= 0) {
      this.blinkT = 0.12;
      this.blinkIn = 2.3 + Math.random() * 4.8;
    }
    if (this.blinkT > 0) this.blinkT -= dt;
    this.blink = this.blinkT > 0 ? Math.sin(clamp(1 - this.blinkT / 0.12, 0, 1) * Math.PI) : 0;

    for (const ear of this.ears) {
      ear.twitchIn -= dt;
      if (ear.twitchIn <= 0) {
        ear.twitchIn = 3.5 + Math.random() * 7;
        ear.vel += (Math.random() < 0.5 ? -1 : 1) * (1.5 + Math.random() * 2.2);
      }
      const target = -0.18
        - Math.abs(this.vx) / runSpeed * 0.5
        - this.flail * 0.32
        + (this.squeakT > 0 ? 0.35 : 0)
        + (ear.side > 0 ? 0.06 : -0.02);
      const force = (target - ear.rot) * 95 - ear.vel * 12;
      ear.vel += force * dt;
      ear.rot = clamp(ear.rot + ear.vel * dt, -1.35, 0.8);
    }
  }

  // --------------------------------------------------------------- render

  draw(ctx) {
    const s = this.s;
    ctx.save();

    // squash and stretch around the feet
    const pivotY = this.floorY + 0.5;
    ctx.translate(this.x, pivotY);
    ctx.scale(1 + this.squash * 0.16, 1 - this.squash * 0.22);
    ctx.translate(-this.x, -pivotY);

    this.drawTail(ctx);

    for (const leg of this.legs) if (leg.far) this.drawLeg(ctx, leg);
    this.drawBody(ctx);
    for (const leg of this.legs) if (!leg.far) this.drawLeg(ctx, leg);
    this.drawHead(ctx);

    ctx.restore();

    if (ui.rig) this.drawRig(ctx);
  }

  drawShadow(ctx) {
    const floor = this.surfaceAt(this.x);
    const height = Math.max(0, floor - (this.y + this.ride));
    const k = clamp(1 - height / 130, 0.18, 1);
    const s = this.s;
    const slope = Math.atan2(groundY(this.x + 2) - groundY(this.x - 2), 4);

    ctx.save();
    ctx.translate(this.x, floor + 1);
    ctx.rotate(slope);
    ctx.scale(1, 0.24);
    const g = ctx.createRadialGradient(0, 0, 1, 0, 0, 34 * s);
    g.addColorStop(0, `rgba(5,10,9,${0.33 * k})`);
    g.addColorStop(0.65, `rgba(5,10,9,${0.18 * k})`);
    g.addColorStop(1, 'rgba(5,10,9,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 0, 34 * s, 7 * s, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  drawBody(ctx) {
    const s = this.s;
    const chain = smoothChain(this.spine, this.radii, 3);
    drawTaperedChain(ctx, chain.pts, chain.w, this.tint, COL.inkSoft, 0.85 * s);

    // underside shade
    const belly = edgeChain(chain.pts, chain.w, -1, 0.46);
    ctx.strokeStyle = 'rgba(127,119,114,0.34)';
    ctx.lineWidth = 2.6 * s;
    ctx.beginPath();
    for (let i = 0; i < belly.length; i++) {
      if (i === 0) ctx.moveTo(belly[i].x, belly[i].y);
      else ctx.lineTo(belly[i].x, belly[i].y);
    }
    ctx.stroke();

    // pale rim along the back
    const back = edgeChain(chain.pts, chain.w, 1, 0.48);
    ctx.strokeStyle = 'rgba(255,235,209,0.28)';
    ctx.lineWidth = 0.9 * s;
    ctx.beginPath();
    for (let i = 0; i < back.length; i++) {
      if (i === 0) ctx.moveTo(back[i].x, back[i].y);
      else ctx.lineTo(back[i].x, back[i].y);
    }
    ctx.stroke();

    // a few tiny strands of fur on the back
    ctx.strokeStyle = 'rgba(118,128,119,0.34)';
    ctx.lineWidth = 0.55 * s;
    for (let i = 4; i < chain.pts.length - 5; i += 5) {
      if (hash(i * 3.7 + this.spawnX * 0.01) < 0.52) continue;
      const p = back[i];
      const a = chain.pts[Math.max(0, i - 1)];
      const b = chain.pts[Math.min(chain.pts.length - 1, i + 1)];
      let nx = -(b.y - a.y), ny = b.x - a.x;
      const l = Math.hypot(nx, ny) || 1;
      const dir = this.facing;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + nx / l * 1.4 * s - dir * 1.2 * s, p.y + ny / l * 1.4 * s - 0.4 * s);
      ctx.stroke();
    }

    // soft socket where the near hind leg meets the body
    const bodyAngle = Math.atan2(this.spine[this.N - 1].y - this.spine[0].y, this.spine[this.N - 1].x - this.spine[0].x);
    const hipLeg = this.legs.find(l => !l.front && !l.far);
    if (hipLeg) {
      ctx.save();
      ctx.translate(hipLeg.hip.x, hipLeg.hip.y - 1.5 * s);
      ctx.rotate(bodyAngle + Math.PI / 2);
      ctx.fillStyle = 'rgba(92,104,97,0.10)';
      ctx.beginPath();
      ctx.ellipse(0, 0, 4.8 * s, 6.5 * s, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  }

  drawTail(ctx) {
    const s = this.s;
    const pts = this.tail.map(n => ({ x: n.x, y: n.y }));
    const chain = smoothChain(pts, this.tailRadii, 3);
    drawTaperedChain(ctx, chain.pts, chain.w, this.tint, COL.inkSoft, 0.8 * s);

    const belly = edgeChain(chain.pts, chain.w, -1, 0.4);
    ctx.strokeStyle = 'rgba(111,123,116,0.26)';
    ctx.lineWidth = 1.4 * s;
    ctx.beginPath();
    for (let i = 0; i < belly.length; i++) {
      if (i === 0) ctx.moveTo(belly[i].x, belly[i].y);
      else ctx.lineTo(belly[i].x, belly[i].y);
    }
    ctx.stroke();

    const back = edgeChain(chain.pts, chain.w, 1, 0.45);
    ctx.strokeStyle = 'rgba(255,252,239,0.14)';
    ctx.lineWidth = 0.7 * s;
    ctx.beginPath();
    for (let i = 0; i < back.length; i++) {
      if (i === 0) ctx.moveTo(back[i].x, back[i].y);
      else ctx.lineTo(back[i].x, back[i].y);
    }
    ctx.stroke();
  }

  drawLeg(ctx, leg) {
    const s = this.s;
    const hip = leg.hip;
    const knee = leg.knee;
    const foot = leg.ikFoot;

    const fill = leg.far ? '#cfcdc0' : '#e9e5d8';
    const outline = leg.far ? 'rgba(30,43,38,0.7)' : COL.ink;
    const hi = leg.far ? 'rgba(255,252,238,0.12)' : 'rgba(255,252,238,0.25)';

    const w1 = leg.width;
    const w2 = leg.width * (leg.front ? 0.76 : 0.82);

    // outline pass
    ctx.strokeStyle = outline;
    ctx.lineWidth = w1 + 1.4 * s;
    ctx.beginPath();
    ctx.moveTo(hip.x, hip.y);
    ctx.lineTo(knee.x, knee.y);
    ctx.stroke();
    ctx.lineWidth = w2 + 1.25 * s;
    ctx.beginPath();
    ctx.moveTo(knee.x, knee.y);
    ctx.lineTo(foot.x, foot.y);
    ctx.stroke();

    // fill pass
    ctx.strokeStyle = fill;
    ctx.lineWidth = w1;
    ctx.beginPath();
    ctx.moveTo(hip.x, hip.y);
    ctx.lineTo(knee.x, knee.y);
    ctx.stroke();
    ctx.lineWidth = w2;
    ctx.beginPath();
    ctx.moveTo(knee.x, knee.y);
    ctx.lineTo(foot.x, foot.y);
    ctx.stroke();
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.arc(knee.x, knee.y, w2 * 0.5, 0, TAU);
    ctx.fill();

    // a thin highlight on the upper limb
    ctx.strokeStyle = hi;
    ctx.lineWidth = 0.6 * s;
    ctx.beginPath();
    ctx.moveTo(hip.x - 0.4 * s, hip.y);
    ctx.lineTo(knee.x - 0.4 * s, knee.y);
    ctx.stroke();

    // paw
    ctx.save();
    ctx.translate(foot.x, foot.y);
    const fa = clamp(leg.footAngle, -0.55, 0.55);
    ctx.rotate(fa);
    ctx.scale(this.facing, 1);

    const pw = leg.front ? 2.7 : 3.4;
    const ph = leg.front ? 1.5 : 1.85;
    ctx.fillStyle = fill;
    ctx.strokeStyle = outline;
    ctx.lineWidth = 0.9 * s;
    ctx.beginPath();
    ctx.ellipse(leg.front ? 0.5 : 0.3, -ph * 0.35, pw, ph, 0, 0, TAU);
    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle = outline;
    ctx.lineWidth = 0.55 * s;
    const toes = leg.front ? 3 : 2;
    for (let i = 0; i < toes; i++) {
      const ty = (i - (toes - 1) * 0.5) * (leg.front ? 1.1 : 1.4);
      ctx.beginPath();
      ctx.moveTo(leg.front ? 1.9 : 2.2, ty * 0.65);
      ctx.lineTo(leg.front ? 3.6 : 3.8, ty);
      ctx.stroke();
    }
    ctx.restore();
  }

  drawEar(ctx, ear, far) {
    const bx = far ? -5.0 : 1.8;
    const by = far ? -6.8 : -7.0;
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(ear.rot + (far ? -0.38 : 0.3));
    const sc = (far ? 0.9 : 1.02) * (this.pup ? 1.1 : 1);
    ctx.scale(sc, sc);

    ctx.beginPath();
    ctx.moveTo(0, 1.0);
    ctx.bezierCurveTo(-6.1, -1.4, -5.6, -8.0, -1.5, -10.0);
    ctx.bezierCurveTo(2.1, -8.8, 4.4, -4.4, 2.7, 0.4);
    ctx.closePath();
    ctx.fillStyle = far ? '#d2d0c3' : this.tint;
    ctx.fill();
    ctx.strokeStyle = far ? 'rgba(37,51,46,0.45)' : COL.ink;
    ctx.lineWidth = 0.9;
    ctx.stroke();

    // inner ear — muted, not bunny-pink
    ctx.beginPath();
    ctx.moveTo(-0.2, -1.3);
    ctx.bezierCurveTo(-3.0, -3.2, -2.8, -6.2, -1.1, -8.0);
    ctx.bezierCurveTo(0.7, -6.9, 1.7, -4.0, 0.8, -1.5);
    ctx.closePath();
    ctx.fillStyle = far ? 'rgba(120,100,96,0.20)' : 'rgba(189,146,137,0.32)';
    ctx.fill();
    ctx.restore();
  }

  drawHead(ctx) {
    const s = this.s;
    const hs = s * (this.pup ? 1.04 : 0.98);

    ctx.save();
    ctx.translate(this.head.x, this.head.y);
    ctx.scale(this.facing * hs, hs);
    ctx.rotate(this.headTilt);

    // ears
    this.drawEar(ctx, this.ears[0], true);
    this.drawEar(ctx, this.ears[1], false);

    // head silhouette — round and soft, with just the hint of a snout
    const headPath = new Path2D();
    headPath.moveTo(8.4, -0.6);
    headPath.bezierCurveTo(10.6, 0.4, 10.5, 3.2, 7.8, 5.2);
    headPath.bezierCurveTo(5.0, 7.4, -1.2, 8.0, -4.9, 5.4);
    headPath.bezierCurveTo(-9.2, 3.0, -9.9, -3.2, -6.3, -7.2);
    headPath.bezierCurveTo(-3.2, -10.7, 3.7, -10.8, 7.0, -7.0);
    headPath.bezierCurveTo(8.1, -5.4, 8.9, -2.6, 8.4, -0.6);
    headPath.closePath();

    ctx.fillStyle = this.tint;
    ctx.fill(headPath);

    // soft gradient over the face
    ctx.save();
    ctx.clip(headPath);
    const hg = ctx.createLinearGradient(0, -10, 0, 8);
    hg.addColorStop(0, 'rgba(255,253,241,0.32)');
    hg.addColorStop(0.55, 'rgba(255,255,255,0)');
    hg.addColorStop(1, 'rgba(120,132,124,0.24)');
    ctx.fillStyle = hg;
    ctx.fillRect(-12, -12, 24, 22);

    // warm cheek
    const cheek = ctx.createRadialGradient(4.2, 3.0, 0.3, 4.2, 3.0, 7.5);
    cheek.addColorStop(0, 'rgba(225,176,161,0.18)');
    cheek.addColorStop(1, 'rgba(225,176,161,0)');
    ctx.fillStyle = cheek;
    ctx.fillRect(-12, -12, 24, 22);

    // soft muzzle plane
    const muzzle = ctx.createRadialGradient(7.5, 3.8, 0.4, 7.5, 3.8, 5.2);
    muzzle.addColorStop(0, 'rgba(174,154,145,0.16)');
    muzzle.addColorStop(1, 'rgba(174,154,145,0)');
    ctx.fillStyle = muzzle;
    ctx.fillRect(-12, -12, 24, 22);
    ctx.restore();

    ctx.strokeStyle = COL.ink;
    ctx.lineWidth = 1.0;
    ctx.stroke(headPath);

    // tiny cheek fur wisp
    // (kept extremely subtle so the head silhouette stays clean)

    // eyes
    const squint = clamp(this.act * 0.11 + (this.crouch > 0.5 ? 0.08 : 0), 0, 0.2);
    const widen = this.flail * 0.07;
    const open = clamp((1 - this.blink * 0.93) * (1 - squint + widen), 0.055, 1.12);
    const gx = this.gazeX;
    const gy = this.gazeY;

    const eyes = [
      { x: -2.7, y: -0.6, rx: 1.85, ry: 2.9, rot: -0.06, far: true },
      { x: 2.9, y: -0.4, rx: 2.4, ry: 3.6, rot: 0.03, far: false },
    ];
    for (const e of eyes) {
      const ex = e.x + gx * (e.far ? 0.4 : 0.55);
      const ey = e.y + gy * (e.far ? 0.35 : 0.45);
      ctx.fillStyle = COL.eye;
      ctx.beginPath();
      ctx.ellipse(ex, ey, e.rx, Math.max(0.15, e.ry * open), e.rot, 0, TAU);
      ctx.fill();

      if (open > 0.3) {
        ctx.fillStyle = 'rgba(250,248,234,0.72)';
        ctx.beginPath();
        ctx.arc(ex - e.rx * 0.3, ey - e.ry * open * 0.4, e.far ? 0.22 : 0.32, 0, TAU);
        ctx.fill();
      }
    }

    // nose
    ctx.fillStyle = '#2c2220';
    ctx.beginPath();
    ctx.ellipse(8.35, 3.15, 1.25, 1.0, -0.12, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,240,230,0.5)';
    ctx.beginPath();
    ctx.arc(8.0, 2.8, 0.32, 0, TAU);
    ctx.fill();

    // mouth line
    if (this.squeakT <= 0 && this.flail <= 0.52) {
      ctx.strokeStyle = 'rgba(50,40,37,0.6)';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(8.35, 4.3);
      ctx.quadraticCurveTo(7.55, 5.0, 8.55, 5.15);
      ctx.stroke();
    }

    // mouth: opens for squeaks or long falls
    if (this.squeakT > 0 || this.flail > 0.52) {
      const mh = this.squeakT > 0 ? 0.9 + Math.sin(this.t * 35) * 0.25 : 0.55;
      ctx.fillStyle = 'rgba(42,32,30,0.7)';
      ctx.beginPath();
      ctx.ellipse(6.8, 4.8, 0.95, mh, 0.12, 0, TAU);
      ctx.fill();
    }

    ctx.restore();
  }

  drawRig(ctx) {
    const s = this.s;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // ground and support
    ctx.strokeStyle = 'rgba(108,226,198,0.36)';
    ctx.lineWidth = 0.6;
    for (let x = this.x - 34; x < this.x + 40; x += 4) {
      ctx.beginPath();
      ctx.moveTo(x, groundY(x));
      ctx.lineTo(x + 2.6, groundY(x));
      ctx.stroke();
    }

    // spine
    ctx.strokeStyle = 'rgba(119,226,206,0.82)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    for (let i = 0; i < this.spine.length; i++) {
      if (i === 0) ctx.moveTo(this.spine[i].x, this.spine[i].y);
      else ctx.lineTo(this.spine[i].x, this.spine[i].y);
    }
    ctx.stroke();

    for (let i = 0; i < this.spine.length; i++) {
      const p = this.spine[i];
      ctx.strokeStyle = 'rgba(119,226,206,0.25)';
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.arc(p.x, p.y, this.radii[i], 0, TAU);
      ctx.stroke();
      ctx.fillStyle = i === 0 ? '#f2d494' : 'rgba(119,226,206,0.9)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 0.9, 0, TAU);
      ctx.fill();
    }

    // head anchor
    ctx.strokeStyle = 'rgba(242,212,148,0.8)';
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.arc(this.head.x, this.head.y, 9 * s, 0, TAU);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(this.head.x, this.head.y);
    ctx.lineTo(this.head.x + this.facing * 13 * s, this.head.y);
    ctx.stroke();

    // legs
    for (const leg of this.legs) {
      const col = leg.far ? 'rgba(244,197,109,0.45)' : 'rgba(244,197,109,0.9)';
      ctx.strokeStyle = col;
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(leg.hip.x, leg.hip.y);
      ctx.lineTo(leg.knee.x, leg.knee.y);
      ctx.lineTo(leg.ikFoot.x, leg.ikFoot.y);
      ctx.stroke();
      ctx.fillStyle = col;
      for (const p of [leg.hip, leg.knee, leg.ikFoot]) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.1, 0, TAU);
        ctx.fill();
      }
      // foot target
      ctx.strokeStyle = 'rgba(255,143,92,0.9)';
      ctx.lineWidth = 0.65;
      ctx.beginPath();
      ctx.moveTo(leg.foot.x - 2.2, leg.foot.y - 2.2);
      ctx.lineTo(leg.foot.x + 2.2, leg.foot.y + 2.2);
      ctx.moveTo(leg.foot.x + 2.2, leg.foot.y - 2.2);
      ctx.lineTo(leg.foot.x - 2.2, leg.foot.y + 2.2);
      ctx.stroke();
    }

    // tail
    ctx.strokeStyle = 'rgba(220,148,197,0.8)';
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    for (let i = 0; i < this.tail.length; i++) {
      if (i === 0) ctx.moveTo(this.tail[i].x, this.tail[i].y);
      else ctx.lineTo(this.tail[i].x, this.tail[i].y);
    }
    ctx.stroke();
    for (let i = 1; i < this.tail.length; i++) {
      ctx.fillStyle = 'rgba(220,148,197,0.65)';
      ctx.beginPath();
      ctx.arc(this.tail[i].x, this.tail[i].y, 0.8, 0, TAU);
      ctx.fill();
    }

    // velocity and root
    ctx.strokeStyle = 'rgba(255,250,231,0.75)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x + this.vx * 0.16, this.y + this.vy * 0.16);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,250,231,0.9)';
    ctx.beginPath();
    ctx.arc(this.x, this.y, 1.2, 0, TAU);
    ctx.fill();

    ctx.restore();
  }

  // __CHARACTER_RENDER_END__
}

// ------------------------------------------------------------- rig helpers

function solveIK(ax, ay, tx, ty, l1, l2, bend) {
  let dx = tx - ax;
  let dy = ty - ay;
  let d = Math.hypot(dx, dy) || 0.0001;
  const minD = Math.abs(l1 - l2) + 0.5;
  const maxD = l1 + l2 - 0.35;
  if (d < minD) {
    dx = dx / d * minD;
    dy = dy / d * minD;
    d = minD;
    tx = ax + dx;
    ty = ay + dy;
  } else if (d > maxD) {
    dx = dx / d * maxD;
    dy = dy / d * maxD;
    d = maxD;
    tx = ax + dx;
    ty = ay + dy;
  }
  const base = Math.atan2(dy, dx);
  const cosA = clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1);
  const a = Math.acos(cosA);
  const ang = base + bend * a;
  return {
    knee: { x: ax + Math.cos(ang) * l1, y: ay + Math.sin(ang) * l1 },
    foot: { x: ax + dx, y: ay + dy },
  };
}

function catmullPoint(p0, p1, p2, p3, t) {
  const t2 = t * t;
  const t3 = t2 * t;
  return {
    x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
    y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3),
  };
}

function smoothChain(points, radii, subdiv) {
  const n = points.length;
  const pts = [];
  const w = [];
  if (n < 2) return { pts: points.slice(), w: radii.slice() };
  for (let i = 0; i < n - 1; i++) {
    const p0 = points[Math.max(0, i - 1)];
    const p1 = points[i];
    const p2 = points[i + 1];
    const p3 = points[Math.min(n - 1, i + 2)];
    for (let j = 0; j < subdiv; j++) {
      const t = j / subdiv;
      pts.push(catmullPoint(p0, p1, p2, p3, t));
      w.push(lerp(radii[i], radii[i + 1], smoothstep(t)));
    }
  }
  pts.push({ x: points[n - 1].x, y: points[n - 1].y });
  w.push(radii[n - 1]);
  return { pts, w };
}

function edgeChain(pts, widths, side, factor) {
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[Math.max(0, i - 1)];
    const b = pts[Math.min(pts.length - 1, i + 1)];
    let tx = b.x - a.x;
    let ty = b.y - a.y;
    const l = Math.hypot(tx, ty) || 1;
    tx /= l; ty /= l;
    const nx = ty;
    const ny = -tx;
    out.push({
      x: pts[i].x + nx * widths[i] * factor * side,
      y: pts[i].y + ny * widths[i] * factor * side,
    });
  }
  return out;
}

function drawTaperedChain(ctx, pts, widths, fill, outline, outlineExtra) {
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // outline first, so the filled segments hide every internal seam
  ctx.strokeStyle = outline;
  for (let i = 0; i < pts.length - 1; i++) {
    ctx.lineWidth = widths[i] + widths[i + 1] + outlineExtra * 2;
    ctx.beginPath();
    ctx.moveTo(pts[i].x, pts[i].y);
    ctx.lineTo(pts[i + 1].x, pts[i + 1].y);
    ctx.stroke();
  }

  ctx.strokeStyle = fill;
  for (let i = 0; i < pts.length - 1; i++) {
    ctx.lineWidth = widths[i] + widths[i + 1];
    ctx.beginPath();
    ctx.moveTo(pts[i].x, pts[i].y);
    ctx.lineTo(pts[i + 1].x, pts[i + 1].y);
    ctx.stroke();
  }
  ctx.restore();
}

    let player = new Slugcat({ x: 48, player: true, facing: 1, scale: 1.25 });
const pup = new Slugcat({ x: player.x - 74, facing: 1, scale: 0.62, pup: true, speedScale: 0.82 });
let pupJumpCooldown = 0;
cam.x = player.x + 46;
cam.y = player.y - 30;

resetAmbient();

function resetWorld() {
  player.reset(player.spawnX);
  player.facing = 1;
  pup.reset(player.x - 70);
  pup.facing = 1;
  cam.x = player.x + 46;
  cam.y = player.y - 30;
  cam.shake = 0;
  cam.flash = 0;
  resetAmbient();
  audio.step(0.7, true);
}

// ---------------------------------------------------------------- mouse

function updateMouseWorld() {
  const px = (mouse.cx * view.dpr - view.ox) / view.scale;
  const py = (mouse.cy * view.dpr - view.oy) / view.scale;
  mouse.x = cam.x + px - VW / 2;
  mouse.y = cam.y + py - VH / 2;
}

// ---------------------------------------------------------------- camera

function updateCamera(dt) {
  const lookAhead = clamp(player.vx * 0.30, -58, 64) + player.facing * 15;
  let mousePull = 0;
  if (mouse.moved) mousePull = clamp((mouse.x - player.x) * 0.045, -20, 20);
  const targetX = player.x + lookAhead + mousePull;
  let targetY = player.y - 29 + clamp(player.vy * 0.045, -14, 18);
  if (player.sliding) targetY += 5;

  cam.x = damp(cam.x, targetX, 4.1, dt);
  cam.y = damp(cam.y, targetY, 3.8, dt);
  cam.y = Math.min(cam.y, groundY(cam.x) - 38);
  cam.y = Math.max(cam.y, -500);

  cam.shake = Math.max(0, cam.shake - dt * 7);
  const sh = cam.shake * cam.shake * 0.8;
  cam.shakeX = (Math.random() * 2 - 1) * sh;
  cam.shakeY = (Math.random() * 2 - 1) * sh * 0.7;
}

// ---------------------------------------------------------------- tick

let last = performance.now();
let accumulator = 0;
const STEP = 1 / 120;

function updatePup(dt) {
  const s = pup.s;
  pupJumpCooldown = Math.max(0, pupJumpCooldown - dt);

  const targetX = player.x - player.facing * (40 * s + 12);
  const dx = targetX - pup.x;
  const distToPlayer = Math.abs(player.x - pup.x);
  pup.speedScale = distToPlayer > 72 ? 1.15 : 0.96;
  let move = 0;
  if (Math.abs(dx) > 7 * s) {
    move = clamp(dx / (34 * s), -0.9, 0.9);
    if (Math.abs(move) < 0.25) move = sign(dx) * 0.25;
  }

  let jumpPressed = false;
  if (pup.onGround && pupJumpCooldown <= 0) {
    if (player.squeakT > 0.2 && distToPlayer < 110) {
      pup.squeakT = Math.max(pup.squeakT, 0.2);
      jumpPressed = true;
      pupJumpCooldown = 0.7;
    } else if (player.y < pup.y - 22 && distToPlayer < 90) {
      jumpPressed = true;
      pupJumpCooldown = 0.9;
    } else if (player.vy < -110 && distToPlayer < 80 && Math.random() < 0.02) {
      jumpPressed = true;
      pupJumpCooldown = 0.8;
    }
  }

  pup.setLook(player.x, player.y - 12 + Math.sin(worldTime.t * 0.9) * 4);
  if (Math.abs(dx) < 5 * s && player.idleBlend > 0.4) {
    const toward = sign(player.x - pup.x);
    if (toward) pup.facing = toward;
  }

  pup.update(dt, {
    move,
    jump: jumpPressed || pup.vy < -30,
    jumpPressed,
    down: false,
    downPressed: false,
    sprint: distToPlayer > 95 || Math.abs(dx) > 95,
  });

  if (Math.abs(pup.x - player.x) > 300 || pup.y > 900) {
    spawnDust(pup.x, pup.floorY, 3, 0.55, false);
    pup.reset(player.x - player.facing * 58);
  }
}

function tick(dt) {
  updateMouseWorld();
  let lookX = mouse.x;
  let lookY = mouse.y;
  if (!mouse.moved) {
    const glancePup = player.idleBlend > 0.7 && Math.sin(worldTime.t * 0.31 + 0.8) > 0.55;
    if (glancePup) {
      lookX = pup.head.x;
      lookY = pup.head.y - 4;
    } else {
      lookX = player.x + player.facing * 70;
      lookY = player.y - 10;
    }
  }
  player.setLook(lookX, lookY);

  const ctrl = {
    move: ((keys.KeyD || keys.ArrowRight) ? 1 : 0) - ((keys.KeyA || keys.ArrowLeft) ? 1 : 0),
    jump: !!(keys.Space || keys.KeyW || keys.ArrowUp),
    jumpPressed: press.jump,
    down: !!(keys.KeyS || keys.ArrowDown),
    downPressed: press.down,
    sprint: !!(keys.ShiftLeft || keys.ShiftRight || keys.ControlLeft || keys.ControlRight),
  };
  press.jump = false;
  press.down = false;

  player.update(dt, ctrl);
  updatePup(dt);
  updateWeather(dt);
  updateCamera(dt);
}

// ---------------------------------------------------------------- world render

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  drawSky();
  drawWeatherSky();
  drawFarSkyline();
  drawFogBand(VH * 0.55, 70, 0.18, '201,201,178', cam.x * 0.02 + worldTime.t * 2.2);
  drawMidRuins();
  drawFogBand(VH * 0.63, 58, 0.14, '184,187,166', cam.x * 0.04 + worldTime.t * 1.4);
  drawViaduct();
  drawFogBand(VH * 0.67, 46, 0.11, '174,179,159', cam.x * 0.06 + worldTime.t * 1.1);
  drawNearRuins();
  drawFogBand(VH * 0.69, 48, 0.10, '166,172,153', cam.x * 0.08 + worldTime.t * 0.8);
  drawOverhang();
  drawLightShafts();

  // distant rain is screen-space, behind the terrain
  drawRain(false);

  const x0 = cam.x - VW / 2 - 100;
  const x1 = cam.x + VW / 2 + 100;

  ctx.save();
  ctx.translate(VW / 2 - cam.x + cam.shakeX, VH / 2 - cam.y + cam.shakeY);

  drawGround(x0, x1);
  for (const p of platformsNear(x0, x1)) {
    drawPlatform(p, Math.abs(p.x - player.x) < 120);
  }

  drawRipples();
  drawMotes();
  drawFlies();
  drawParticles(false);

  pup.drawShadow(ctx);
  pup.draw(ctx);
  player.drawShadow(ctx);
  player.draw(ctx);

  drawParticles(true);
  ctx.restore();

  drawFogBand(VH * 0.72, 26, 0.055, '172,178,161', cam.x * 0.1 + worldTime.t * 0.5);
  drawForegroundVines();
  drawRain(true);
  drawForegroundGrass();
  drawForegroundLedge();
  drawColorGrade();
  drawScreenVignette();

  // blit the tiny world up to the display
  sctx.setTransform(1, 0, 0, 1, 0, 0);
  sctx.imageSmoothingEnabled = false;
  sctx.fillStyle = '#070b0a';
  sctx.fillRect(0, 0, screen.width, screen.height);
  sctx.drawImage(off, view.ox, view.oy, VW * view.scale, VH * view.scale);

  drawHUD();
}

// ---------------------------------------------------------------- HUD

function hudFont(size, weight = 400) {
  sctx.font = `${weight} ${size}px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace`;
}

function spacedText(text, x, y, spacing, align = 'left') {
  let total = 0;
  for (const ch of text) total += sctx.measureText(ch).width + spacing;
  total -= spacing;
  let cx = align === 'right' ? x - total : x;
  for (const ch of text) {
    sctx.fillText(ch, cx, y);
    cx += sctx.measureText(ch).width + spacing;
  }
  return total;
}

function drawKeycap(label, x, y, h = 15, sc = 1) {
  hudFont(8 * sc, 600);
  const w = Math.ceil(sctx.measureText(label).width) + 10 * sc;
  sctx.fillStyle = 'rgba(9,15,13,0.52)';
  sctx.strokeStyle = 'rgba(220,226,208,0.15)';
  sctx.lineWidth = Math.max(0.7, sc);
  sctx.beginPath();
  sctx.roundRect(x + 0.5, y + 0.5, w - 1, h - 1, 2.5 * sc);
  sctx.fill();
  sctx.stroke();
  sctx.fillStyle = 'rgba(231,234,217,0.72)';
  sctx.fillText(label, x + 5 * sc, y + 10.2 * sc);
  return w;
}

function drawHUD() {
  if (!ui.hud) return;
  const dpr = view.dpr;
  const vx = view.ox / dpr;
  const vy = view.oy / dpr;
  const vw = VW * view.scale / dpr;
  const vh = VH * view.scale / dpr;
  if (vw < 240 || vh < 160) return;

  const sc = clamp(vh / 720, 0.85, 1.7);

  sctx.save();
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.textBaseline = 'alphabetic';
  sctx.textAlign = 'left';

  const pad = clamp(vw * 0.032, 15, 27) * sc;
  const left = vx + pad;
  const right = vx + vw - pad;
  const top = vy + pad;
  const bottom = vy + vh - pad;

  // title
  hudFont(12.5 * sc, 600);
  sctx.fillStyle = 'rgba(237,236,221,0.9)';
  spacedText('SLUGCAT', left, top + 12 * sc, 3.9 * sc);
  hudFont(7.4 * sc, 400);
  sctx.fillStyle = 'rgba(218,224,207,0.38)';
  spacedText('A PROCEDURAL CREATURE STUDY', left, top + 25 * sc, 1.35 * sc);

  // divider + state
  sctx.fillStyle = 'rgba(211,224,207,0.14)';
  sctx.fillRect(left, top + 35 * sc, Math.min(158 * sc, vw * 0.36), Math.max(1, sc));

  const state = player.stateName;
  hudFont(8.4 * sc, 600);
  const stateText = state.toUpperCase();
  sctx.fillStyle = state === 'air' || state === 'flail'
    ? 'rgba(231,193,125,0.9)'
    : 'rgba(167,214,190,0.9)';
  const stateW = spacedText(stateText, left, top + 49 * sc, 1.8 * sc);

  // four little contact lights / gait readout
  hudFont(7.2 * sc, 400);
  const infoX = left + stateW + 15 * sc;
  sctx.fillStyle = 'rgba(213,222,206,0.32)';
  sctx.fillText(
    player.onGround ? (player.sliding ? 'belly slide' : 'grounded') : player.flail > 0.35 ? 'reaching' : 'airborne',
    infoX, top + 49 * sc
  );
  for (let i = 0; i < player.legs.length; i++) {
    const leg = player.legs[i];
    const done = !leg.step;
    sctx.fillStyle = done ? 'rgba(167,214,190,0.55)' : 'rgba(213,222,206,0.12)';
    sctx.beginPath();
    sctx.arc(infoX + 3 * sc + i * 8 * sc, top + 58 * sc, 1.7 * sc, 0, TAU);
    sctx.fill();
  }

  // top right weather
  hudFont(7.4 * sc, 500);
  sctx.fillStyle = 'rgba(222,228,211,0.42)';
  scaledRightText('RAIN / HEAVY', right, top + 10 * sc, 1.1 * sc);
  hudFont(7 * sc, 400);
  sctx.fillStyle = 'rgba(222,228,211,0.22)';
  const cycle = 'CYCLE 001';
  scaledRightText(cycle, right, top + 22 * sc, 0.8 * sc);

  if (ui.rig) {
    hudFont(7.2 * sc, 600);
    sctx.fillStyle = 'rgba(242,199,117,0.9)';
    scaledRightText('RIG VIEW', right, top + 39 * sc, 1.4 * sc);
    hudFont(6.6 * sc, 400);
    sctx.fillStyle = 'rgba(218,225,207,0.32)';
    scaledRightText('cyan spine · gold IK · pink tail', right, top + 49 * sc, 0.4 * sc);
  }

  // bottom left controls
  let kx = left;
  const ky = bottom - 15 * sc;
  const narrow = vw < 660 * sc;
  const entries = narrow
    ? [['A / D', 'move'], ['SPACE', 'jump'], ['SHIFT', 'run']]
    : [['A / D', 'move'], ['SPACE', 'jump'], ['SHIFT', 'run'], ['S', 'slide'], ['MOUSE', 'look']];
  for (const [key, label] of entries) {
    const kw = drawKeycap(key, kx, ky, 15 * sc, sc);
    hudFont(7.5 * sc, 400);
    sctx.fillStyle = 'rgba(216,224,208,0.35)';
    sctx.fillText(label, kx + kw + 5 * sc, ky + 10 * sc);
    kx += kw + 7 * sc + sctx.measureText(label).width + 13 * sc;
  }

  // bottom right actions
  hudFont(7.2 * sc, 400);
  sctx.fillStyle = 'rgba(216,224,208,0.3)';
  const hint = narrow
    ? 'V rig · H hud'
    : 'Q squeak · V rig · H hud · F fullscreen · M sound';
  let hx = right;
  for (let i = hint.length - 1; i >= 0; i--) {
    const ch = hint[i];
    const w = sctx.measureText(ch).width;
    hx -= w;
    sctx.fillText(ch, hx, bottom - 4 * sc);
    hx -= 0.35 * sc;
  }

  // sound state dot
  if (audio.started) {
    sctx.fillStyle = audio.muted ? 'rgba(231,193,125,0.5)' : 'rgba(167,214,190,0.6)';
    sctx.beginPath();
    sctx.arc(right - 3 * sc, bottom - 15 * sc, 2.2 * sc, 0, TAU);
    sctx.fill();
  }

  sctx.restore();
}

// scaledRightText draws right-aligned text with a tiny bit of letterspacing.
function scaledRightText(text, x, y, spacing) {
  let total = 0;
  for (const ch of text) total += sctx.measureText(ch).width + spacing;
  total -= spacing;
  let cx = x - total;
  for (const ch of text) {
    sctx.fillText(ch, cx, y);
    cx += sctx.measureText(ch).width + spacing;
  }
}

// ---------------------------------------------------------------- main loop

function frame(now) {
  const raw = Math.min(0.08, (now - last) / 1000);
  last = now;
  accumulator += raw;

  let steps = 0;
  while (accumulator >= STEP && steps < 6) {
    tick(STEP);
    accumulator -= STEP;
    steps++;
  }
  if (steps === 6) accumulator = 0;

  render();
  requestAnimationFrame(frame);
}

// initial camera settle and run
updateMouseWorld();
cam.x = player.x + 46;
cam.y = player.y - 30;
requestAnimationFrame(frame);

// keep the cursor meaningful before the first mouse move
mouse.cx = window.innerWidth * 0.68;
mouse.cy = window.innerHeight * 0.44;

// a small handle for tinkering in the console
window.__slug = { player, pup, cam, keys, press, audio, worldTime, groundY, platformsNear };


})();
</script>

</html>
