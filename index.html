<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slugcat — a procedural creature study</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230b1110'/%3E%3Cpath d='M22 22 L18 10 L28 18 Z' fill='%23f1eee2'/%3E%3Cpath d='M42 22 L46 10 L36 18 Z' fill='%23f1eee2'/%3E%3Ccircle cx='32' cy='38' r='17' fill='%23f1eee2'/%3E%3Ccircle cx='25' cy='35' r='4' fill='%23111715'/%3E%3Ccircle cx='39' cy='35' r='4' fill='%23111715'/%3E%3Ccircle cx='32' cy='44' r='1.5' fill='%23251f1e'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #070b0a; overflow: hidden; }
  body { cursor: crosshair; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script>
(() => {
'use strict';

// ======================================================================
//  slugcat — procedural creature study
//  all animation is generated at runtime. there is no walk cycle.
// ======================================================================

const TAU = Math.PI * 2;

const COL = {
  ink:        '#18211f',
  inkSoft:    '#2a3733',
  fur:        '#f1eee2',
  furShade:   '#c6c8be',
  furDeep:    '#aeb3a9',
  belly:      '#d9d7ca',
  highlight:  '#fffdf2',
  ear:        '#d8b9b0',
  earDeep:    '#bd958d',
  eye:        '#111715',
  nose:       '#251f1e',
  water:      '#1b2d2d',
  moss:       '#687966',
  mossLight:  '#8b9a7c',
  rust:       '#8a664e',
};

const walkSpeed = 70;
const runSpeed = 145;
const gravity = 980;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
const smoothstep = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const approach = (v, target, delta) => v < target ? Math.min(v + delta, target) : Math.max(v - delta, target);
const damp = (a, b, rate, dt) => lerp(a, b, 1 - Math.exp(-rate * dt));
const sign = v => v < 0 ? -1 : 1;
const hash = n => {
  const s = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
  return s - Math.floor(s);
};
const hash2 = (x, y) => hash(x * 157.31 + y * 113.97 + 7.13);
const rand = (a, b) => a + Math.random() * (b - a);

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}

// ---------------------------------------------------------------- screen

const screen = document.getElementById('screen');
const sctx = screen.getContext('2d', { alpha: false });
const off = document.createElement('canvas');
const ctx = off.getContext('2d', { alpha: false });

let VW = 640, VH = 360;
const view = { scale: 1, ox: 0, oy: 0, dpr: 1, cssW: 0, cssH: 0 };

function resize() {
  const cssW = window.innerWidth;
  const cssH = window.innerHeight;
  const dpr = Math.min(2, window.devicePixelRatio || 1);

  screen.width = Math.max(1, Math.round(cssW * dpr));
  screen.height = Math.max(1, Math.round(cssH * dpr));
  screen.style.width = cssW + 'px';
  screen.style.height = cssH + 'px';

  VH = 360;
  VW = clamp(Math.round(VH * cssW / cssH), 500, 940);
  off.width = VW;
  off.height = VH;

  view.scale = Math.min(screen.width / VW, screen.height / VH);
  view.ox = (screen.width - VW * view.scale) / 2;
  view.oy = (screen.height - VH * view.scale) / 2;
  view.dpr = dpr;
  view.cssW = cssW;
  view.cssH = cssH;

  sctx.imageSmoothingEnabled = false;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
}
resize();
window.addEventListener('resize', resize);

// ---------------------------------------------------------------- input

const keys = Object.create(null);
const press = { jump: false, down: false, squeak: false };
const mouse = { cx: 0, cy: 0, x: 0, y: 0, moved: false };

const JUMP_KEYS = new Set(['Space', 'KeyW', 'ArrowUp']);
const DOWN_KEYS = new Set(['KeyS', 'ArrowDown']);
const PREVENT = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);

window.addEventListener('keydown', e => {
  audioUnlock();
  if (PREVENT.has(e.code)) e.preventDefault();
  if (!e.repeat) {
    if (JUMP_KEYS.has(e.code)) press.jump = true;
    if (DOWN_KEYS.has(e.code)) press.down = true;
    if (e.code === 'KeyQ') press.squeak = true;
    if (e.code === 'KeyR') resetWorld();
    if (e.code === 'KeyH') ui.hud = !ui.hud;
    if (e.code === 'KeyV') ui.rig = !ui.rig;
    if (e.code === 'KeyM') audio.toggle();
    if (e.code === 'KeyF') toggleFullscreen();
  }
  keys[e.code] = true;
});

window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
});

window.addEventListener('pointermove', e => {
  mouse.cx = e.clientX;
  mouse.cy = e.clientY;
  mouse.moved = true;
});
window.addEventListener('pointerdown', () => { audioUnlock(); audio.init(); });

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}

// ---------------------------------------------------------------- audio
// tiny procedural soundscape: rain, wind, footsteps, jump, land, thunder.

const audio = {
  ac: null, master: null, rainGain: null, started: false, muted: false,
  noise: null, lastStep: 0,

  init() {
    if (this.started) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.started = true;
    const ac = this.ac = new AC();
    this.master = ac.createGain();
    this.master.gain.value = 0;
    this.master.connect(ac.destination);
    this.master.gain.setTargetAtTime(this.muted ? 0 : 0.4, ac.currentTime, 0.7);

    // reusable white noise
    const nbuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const nd = nbuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    this.noise = nbuf;

    // soft looped rain
    const rainBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const rd = rainBuf.getChannelData(0);
    let brown = 0;
    for (let i = 0; i < rd.length; i++) {
      brown = brown * 0.965 + (Math.random() * 2 - 1) * 0.035;
      rd[i] = brown * 3.2 + (Math.random() * 2 - 1) * 0.045;
    }
    const rain = ac.createBufferSource();
    rain.buffer = rainBuf;
    rain.loop = true;
    const rainLP = ac.createBiquadFilter();
    rainLP.type = 'lowpass';
    rainLP.frequency.value = 2100;
    const rainHP = ac.createBiquadFilter();
    rainHP.type = 'highpass';
    rainHP.frequency.value = 260;
    this.rainGain = ac.createGain();
    this.rainGain.gain.value = 0.14;
    rain.connect(rainLP).connect(rainHP).connect(this.rainGain).connect(this.master);
    rain.start();

    // wind
    const wind = ac.createBufferSource();
    wind.buffer = rainBuf;
    wind.loop = true;
    const windLP = ac.createBiquadFilter();
    windLP.type = 'lowpass';
    windLP.frequency.value = 420;
    const windGain = ac.createGain();
    windGain.gain.value = 0.10;
    const windLfo = ac.createOscillator();
    windLfo.frequency.value = 0.07;
    const windLfoGain = ac.createGain();
    windLfoGain.gain.value = 0.045;
    windLfo.connect(windLfoGain).connect(windGain.gain);
    wind.connect(windLP).connect(windGain).connect(this.master);
    wind.start();
    windLfo.start();

    // low ambient drone
    for (const [freq, vol, type] of [[55, 0.025, 'sine'], [82.5, 0.014, 'triangle'], [110, 0.008, 'sine']]) {
      const o = ac.createOscillator();
      o.type = type;
      o.frequency.value = freq;
      const g = ac.createGain();
      g.gain.value = vol;
      const lfo = ac.createOscillator();
      lfo.frequency.value = 0.03 + Math.random() * 0.05;
      const lg = ac.createGain();
      lg.gain.value = vol * 0.5;
      lfo.connect(lg).connect(g.gain);
      o.connect(g).connect(this.master);
      o.start(); lfo.start();
    }
  },

  unlock() {
    if (this.started && this.ac && this.ac.state === 'suspended') this.ac.resume();
  },

  toggle() {
    this.muted = !this.muted;
    if (!this.started) { this.muted = false; this.init(); return; }
    this.master.gain.setTargetAtTime(this.muted ? 0 : 0.4, this.ac.currentTime, 0.15);
  },

  burst(dur, filterType, freq, q, vol, rate = 1) {
    if (!this.ac || this.muted) return;
    const ac = this.ac;
    const src = ac.createBufferSource();
    src.buffer = this.noise;
    src.playbackRate.value = rate;
    const f = ac.createBiquadFilter();
    f.type = filterType;
    f.frequency.value = freq;
    f.Q.value = q;
    const g = ac.createGain();
    const now = ac.currentTime;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(vol, now + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    src.connect(f).connect(g).connect(this.master);
    src.start(now, Math.random() * 0.5, dur + 0.02);
  },

  step(intensity = 1, wet = true) {
    if (!this.ac || this.muted) return;
    const now = performance.now();
    if (now - this.lastStep < 45) return;
    this.lastStep = now;
    this.burst(0.055 + intensity * 0.03, 'bandpass', wet ? 1100 : 620, 0.8, 0.035 + intensity * 0.02, 0.8 + Math.random() * 0.5);
  },

  jump() {
    if (!this.ac || this.muted) return;
    const ac = this.ac, t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(260, t);
    o.frequency.exponentialRampToValueAtTime(430, t + 0.11);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.035, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g).connect(this.master);
    o.start(t); o.stop(t + 0.17);
    this.burst(0.12, 'highpass', 1400, 0.7, 0.022, 1.2);
  },

  land(intensity = 1) {
    if (!this.ac || this.muted) return;
    const ac = this.ac, t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(115, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.19);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.08 * clamp(intensity, 0.3, 1.4), t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
    o.connect(g).connect(this.master);
    o.start(t); o.stop(t + 0.28);
    this.burst(0.17, 'lowpass', 780, 0.5, 0.05 * clamp(intensity, 0.3, 1.4), 0.6);
  },

  squeak() {
    if (!this.ac || this.muted) return;
    const ac = this.ac, t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(620, t);
    o.frequency.linearRampToValueAtTime(920, t + 0.055);
    o.frequency.exponentialRampToValueAtTime(540, t + 0.16);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.045, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g).connect(this.master);
    o.start(t); o.stop(t + 0.2);
  },

  thunder() {
    if (!this.ac || this.muted) return;
    const ac = this.ac, t = ac.currentTime;
    const src = ac.createBufferSource();
    src.buffer = this.noise;
    src.loop = true;
    const f = ac.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(160, t);
    f.frequency.exponentialRampToValueAtTime(55, t + 1.8);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.12);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
    src.connect(f).connect(g).connect(this.master);
    src.start(t, Math.random() * 0.4);
    src.stop(t + 2.3);
  },
};

function audioUnlock() {
  audio.init();
  audio.unlock();
}

// ---------------------------------------------------------------- ui & camera

const ui = { hud: true, rig: false, time: 0 };
const cam = { x: 0, y: 220, shake: 0, shakeX: 0, shakeY: 0, flash: 0 };
const worldTime = { t: 0, storm: 0.58, lightningIn: 14 + Math.random() * 16 };

// ======================================================================
//  world
// ======================================================================

const TERRAIN_BASE = 272;

function groundY(x) {
  let y = TERRAIN_BASE;
  y += Math.sin(x * 0.0024 + 0.3) * 25;
  y += Math.sin(x * 0.0066 + 2.1) * 9;
  y += Math.sin(x * 0.0177 + 4.7) * 3.1;

  const k = Math.floor(x / 760);
  for (let j = -1; j <= 1; j++) {
    const kk = k + j;
    const c = kk * 760 + 120 + hash(kk * 1.7 + 3.2) * 520;
    const h = 8 + hash(kk * 2.3 + 4.7) * 26;
    const w = 90 + hash(kk * 3.1 + 8.4) * 110;
    const d = (x - c) / w;
    if (Math.abs(d) < 1) y -= h * (0.5 + 0.5 * Math.cos(d * Math.PI));
  }
  return y;
}

function groundSlope(x) {
  return (groundY(x + 3) - groundY(x - 3)) / 6;
}

// ------------------------------------------------------------- platforms

const platformCache = new Map();

function platformSet(k) {
  if (platformCache.has(k)) return platformCache.get(k);
  const out = [];
  const chance = hash(k * 4.77 + 2.1);
  if (chance > 0.24) {
    const x = k * 250 + 58 + hash(k * 1.37 + 1.1) * 110;
    const w = 46 + hash(k * 2.21 + 6.8) * 60;
    const cx = x + w * 0.5;
    const h = 34 + hash(k * 3.73 + 2.4) * 20;
    const style = hash(k * 6.17 + 9.1) > 0.48 ? 'girder' : 'slab';
    out.push({ x, y: groundY(cx) - h, w, style, seed: k });
    if (hash(k * 8.91 + 3.4) > 0.72) {
      const w2 = 36 + hash(k * 9.3) * 42;
      const x2 = x + (hash(k * 2.9) > 0.5 ? -w2 * 0.5 : w * 0.55);
      out.push({
        x: x2,
        y: groundY(x2 + w2 * 0.5) - h - 34 - hash(k * 7.2) * 8,
        w: w2,
        style: hash(k * 5.5) > 0.5 ? 'girder' : 'slab',
        seed: k + 0.5,
      });
    }
  }
  platformCache.set(k, out);
  return out;
}

function platformsNear(x0, x1) {
  const out = [];
  const k0 = Math.floor(x0 / 250) - 1;
  const k1 = Math.ceil(x1 / 250) + 1;
  for (let k = k0; k <= k1; k++) {
    for (const p of platformSet(k)) {
      if (p.x + p.w > x0 - 20 && p.x < x1 + 20) out.push(p);
    }
  }
  return out;
}

// ------------------------------------------------------------- background

function skyGradient() {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0.00, '#2f4246');
  g.addColorStop(0.28, '#61756f');
  g.addColorStop(0.55, '#9a9f8e');
  g.addColorStop(0.76, '#c6b396');
  g.addColorStop(1.00, '#8a8a76');
  return g;
}

function drawSky() {
  ctx.fillStyle = skyGradient();
  ctx.fillRect(0, 0, VW, VH);

  // a weak, rain-drowned sun sitting behind the skyline
  const sunX = VW * 0.70 - cam.x * 0.015;
  const sunY = VH * 0.33 - (cam.y - 225) * 0.06;
  const halo = ctx.createRadialGradient(sunX, sunY, 2, sunX, sunY, 175);
  halo.addColorStop(0, 'rgba(255,238,201,0.40)');
  halo.addColorStop(0.16, 'rgba(250,228,191,0.20)');
  halo.addColorStop(0.5, 'rgba(244,220,182,0.07)');
  halo.addColorStop(1, 'rgba(244,220,182,0)');
  ctx.fillStyle = halo;
  ctx.fillRect(0, 0, VW, VH);

  ctx.fillStyle = 'rgba(255,240,207,0.36)';
  ctx.beginPath();
  ctx.arc(sunX, sunY, 17, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,246,218,0.20)';
  ctx.beginPath();
  ctx.arc(sunX, sunY, 28, 0, TAU);
  ctx.fill();

  // slow cloud bands, some warm, some dark
  for (let i = 0; i < 10; i++) {
    const y = 26 + i * 22 + Math.sin(i * 4.1) * 9;
    const drift = -cam.x * (0.012 + i * 0.0035) - worldTime.t * (0.7 + i * 0.2);
    const w = 140 + hash(i * 8.4) * 300;
    const x = ((drift + i * 193 + hash(i * 2.2) * 380) % (VW + w + 260)) - w - 130;
    const a = 0.045 + hash(i * 5.7) * 0.07;
    const dark = hash(i * 2.9) > 0.66;
    ctx.fillStyle = dark ? `rgba(58,76,74,${a})` : `rgba(238,231,211,${a})`;
    ctx.beginPath();
    ctx.ellipse(x + w / 2, y, w / 2, 7 + hash(i + 3) * 13, 0, 0, TAU);
    ctx.fill();
  }

  // rain haze near the horizon
  const haze = ctx.createLinearGradient(0, VH * 0.42, 0, VH * 0.83);
  haze.addColorStop(0, 'rgba(206,200,179,0)');
  haze.addColorStop(0.5, 'rgba(206,200,179,0.18)');
  haze.addColorStop(1, 'rgba(173,177,158,0)');
  ctx.fillStyle = haze;
  ctx.fillRect(0, VH * 0.40, VW, VH * 0.46);
}

function drawFogBand(baseY, thickness, alpha, color, drift = 0) {
  const g = ctx.createLinearGradient(0, baseY - thickness, 0, baseY + thickness);
  g.addColorStop(0, `rgba(${color},0)`);
  g.addColorStop(0.35, `rgba(${color},${alpha})`);
  g.addColorStop(0.65, `rgba(${color},${alpha * 0.75})`);
  g.addColorStop(1, `rgba(${color},0)`);
  ctx.fillStyle = g;
  ctx.fillRect(0, baseY - thickness, VW, thickness * 2);

  for (let i = 0; i < 5; i++) {
    const x = ((i * 229 + drift) % (VW + 260)) - 130;
    const y = baseY + Math.sin(i * 3.1 + drift * 0.01) * thickness * 0.28;
    const rg = ctx.createRadialGradient(x, y, 1, x, y, 135);
    rg.addColorStop(0, `rgba(${color},${alpha * 0.45})`);
    rg.addColorStop(1, `rgba(${color},0)`);
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.ellipse(x, y, 140, thickness * 0.62, 0, 0, TAU);
    ctx.fill();
  }
}

function drawLightShafts() {
  const sunX = VW * 0.70 - cam.x * 0.015;
  const sunY = VH * 0.32;
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < 3; i++) {
    const dx = -95 - i * 74;
    const width = 28 + i * 16;
    const g = ctx.createLinearGradient(sunX, sunY, sunX + dx, VH + 40);
    g.addColorStop(0, 'rgba(247,226,184,0.12)');
    g.addColorStop(0.55, 'rgba(238,215,174,0.055)');
    g.addColorStop(1, 'rgba(220,200,165,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(sunX + i * 38 - 8, sunY);
    ctx.lineTo(sunX + i * 38 + width, sunY);
    ctx.lineTo(sunX + dx + width * 2.2, VH + 60);
    ctx.lineTo(sunX + dx - width * 0.5, VH + 60);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawFarSkyline() {
  const f = 0.10;
  const baseY = VH * 0.585 - (cam.y - 225) * 0.10;

  ctx.save();
  ctx.translate(VW / 2 - cam.x * f, baseY);
  const left = cam.x * f - VW / 2 - 180;
  const right = cam.x * f + VW / 2 + 180;
  const k0 = Math.floor(left / 175) - 1;
  const k1 = Math.ceil(right / 175) + 1;

  // a farther, softer row of structures
  for (let k = Math.floor(left / 240) - 1; k <= Math.ceil(right / 240) + 1; k++) {
    if (hash(k * 5.17 + 2.9) < 0.32) continue;
    const x = k * 240 + hash(k * 1.9) * 90;
    const w = 60 + hash(k * 3.3 + 1.2) * 120;
    const h = 24 + hash(k * 6.1 + 4.8) * 55;
    ctx.fillStyle = `rgba(104,113,101,${0.10 + hash(k * 2.2) * 0.08})`;
    ctx.beginPath();
    ctx.moveTo(x, 8);
    ctx.lineTo(x, -h);
    ctx.lineTo(x + w * 0.28, -h - 8);
    ctx.lineTo(x + w * 0.34, -h + 2);
    ctx.lineTo(x + w * 0.8, -h);
    ctx.lineTo(x + w, -h * 0.7);
    ctx.lineTo(x + w, 8);
    ctx.closePath();
    ctx.fill();
    if (hash(k * 8.2) > 0.5) {
      ctx.fillRect(x + w * 0.6, -h - 14, 2, 16);
    }
  }

  for (let k = k0; k <= k1; k++) {
    const r = hash(k * 3.13 + 1.7);
    const x = k * 175 + hash(k * 1.37 + 0.4) * 70;
    const w = 48 + hash(k * 2.19 + 5.5) * 105;
    const h = 62 + hash(k * 4.41 + 2.2) * 185;
    const kind = Math.floor(hash(k * 7.7 + 3.8) * 4);
    const warm = hash(k * 7.1 + 3.4) > 0.58;
    const col = warm
      ? `rgba(128,113,94,${0.30 + hash(k * 1.9) * 0.2})`
      : `rgba(88,106,100,${0.30 + hash(k * 1.9) * 0.2})`;

    ctx.fillStyle = col;
    ctx.beginPath();

    if (kind === 0) {
      // broken residential slab
      ctx.moveTo(x, 12);
      ctx.lineTo(x, -h * 0.72);
      ctx.lineTo(x + w * 0.14, -h * 0.72);
      ctx.lineTo(x + w * 0.19, -h);
      ctx.lineTo(x + w * 0.55, -h * 0.94);
      ctx.lineTo(x + w * 0.62, -h * 0.73);
      ctx.lineTo(x + w, -h * 0.77);
      ctx.lineTo(x + w, 12);
    } else if (kind === 1) {
      // cylindrical cistern
      ctx.moveTo(x + w * 0.1, 12);
      ctx.lineTo(x + w * 0.1, -h * 0.8);
      ctx.quadraticCurveTo(x + w * 0.5, -h * 1.02, x + w * 0.9, -h * 0.8);
      ctx.lineTo(x + w * 0.9, 12);
      ctx.closePath();
      ctx.fill();
      ctx.fillRect(x + w * 0.48, -h * 0.96, 2, 18);
      ctx.beginPath();
    } else if (kind === 2) {
      // tall chimney / pipe
      ctx.moveTo(x + w * 0.28, 12);
      ctx.lineTo(x + w * 0.34, -h * 1.18);
      ctx.lineTo(x + w * 0.62, -h * 1.18);
      ctx.lineTo(x + w * 0.68, 12);
    } else {
      // low, wide industrial block
      ctx.moveTo(x, 12);
      ctx.lineTo(x, -h * 0.45);
      ctx.lineTo(x + w * 0.2, -h * 0.45);
      ctx.lineTo(x + w * 0.22, -h * 0.63);
      ctx.lineTo(x + w * 0.74, -h * 0.63);
      ctx.lineTo(x + w * 0.78, -h * 0.4);
      ctx.lineTo(x + w, -h * 0.4);
      ctx.lineTo(x + w, 12);
    }
    ctx.closePath();
    ctx.fill();

    // tiny windows
    ctx.fillStyle = `rgba(20,32,31,${0.17 + r * 0.15})`;
    const cols = Math.max(1, Math.floor(w / 15));
    const rows = Math.max(1, Math.floor(h / 19));
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        if (hash2(k + i * 1.37, j * 2.91) > 0.56) {
          ctx.fillRect(x + 7 + i * (w - 12) / cols, -h * 0.78 + j * 16, 2, 3);
        }
      }
    }

    if (hash(k * 3.7) > 0.58) {
      ctx.strokeStyle = col;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x + w * 0.5, -h * 0.8);
      ctx.lineTo(x + w * 0.5 + Math.sin(k) * 3, -h - 16 - hash(k) * 18);
      ctx.stroke();
      ctx.fillStyle = 'rgba(212,111,82,0.28)';
      ctx.fillRect(x + w * 0.5 - 1, -h - 19, 2, 2);
    }

    // occasional warm lit windows
    if (hash(k * 11.1 + 4.2) > 0.72) {
      const wx = x + 8 + hash(k * 2.4) * (w - 16);
      const wy = -h * (0.32 + hash(k * 6.2) * 0.3);
      ctx.fillStyle = 'rgba(238,184,113,0.32)';
      ctx.fillRect(wx, wy, 2, 2);
    }
  }

  // long service pipes and bridges strung between the towers
  ctx.lineCap = 'round';
  for (let j = 0; j < 2; j++) {
    const y = -24 - j * 31;
    ctx.strokeStyle = `rgba(82,96,88,${0.26 - j * 0.06})`;
    ctx.lineWidth = 2.2 - j * 0.6;
    ctx.beginPath();
    for (let x = left; x <= right; x += 18) {
      const yy = y + Math.sin(x * 0.017 + j * 2.2) * 3;
      if (x === left) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
    }
    ctx.stroke();
    ctx.lineWidth = 1;
    for (let x = left + 30; x < right; x += 62) {
      ctx.beginPath();
      ctx.moveTo(x, y - 3);
      ctx.lineTo(x, y + 24);
      ctx.stroke();
    }
  }

  // huge ring/turbine silhouettes, half-drowned in the mist
  for (let k = k0; k <= k1; k++) {
    if (hash(k * 9.13 + 5.6) < 0.79) continue;
    const x = k * 175 + hash(k * 3.3) * 80 + 30;
    const y = -38 - hash(k * 2.4) * 30;
    const rad = 22 + hash(k * 4.1) * 24;
    ctx.strokeStyle = 'rgba(88,102,94,0.30)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, rad, 0, TAU);
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x, y, rad * 0.62, 0, TAU);
    ctx.stroke();
    for (let s = 0; s < 6; s++) {
      const a = s / 6 * TAU + hash(k) * 0.6;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * rad * 0.15, y + Math.sin(a) * rad * 0.15);
      ctx.lineTo(x + Math.cos(a) * rad * 0.95, y + Math.sin(a) * rad * 0.95);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(84,98,90,0.3)';
    ctx.fillRect(x - 3, y + rad, 6, 60);
  }

  // swaying cables between rooftops
  ctx.strokeStyle = 'rgba(49,64,59,0.42)';
  ctx.lineWidth = 0.9;
  for (let k = k0; k <= k1; k += 2) {
    if (hash(k * 8.7 + 1.3) < 0.45) continue;
    const x0 = k * 175 + 20;
    const x1 = x0 + 175 + hash(k * 2.1) * 90;
    const y0 = -40 - hash(k * 3.9) * 80;
    const y1 = -40 - hash(k * 6.3) * 80;
    const sag = 12 + hash(k * 4.7) * 18;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.quadraticCurveTo((x0 + x1) / 2, Math.max(y0, y1) + sag, x1, y1);
    ctx.stroke();
  }

  // obscuring mist at the base
  const mist = ctx.createLinearGradient(0, -80, 0, 16);
  mist.addColorStop(0, 'rgba(142,158,150,0)');
  mist.addColorStop(1, 'rgba(142,158,150,0.28)');
  ctx.fillStyle = mist;
  ctx.fillRect(left, -95, right - left, 110);
  ctx.restore();
}

function drawMidRuins() {
  const f = 0.31;
  const baseY = VH * 0.665 - (cam.y - 225) * 0.20;

  ctx.save();
  ctx.translate(VW / 2 - cam.x * f, baseY);
  const left = cam.x * f - VW / 2 - 220;
  const right = cam.x * f + VW / 2 + 220;

  // long broken arcade wall
  const step = 74;
  const k0 = Math.floor(left / step) - 1;
  const k1 = Math.ceil(right / step) + 1;
  const wallTop = [];
  for (let k = k0; k <= k1; k++) {
    const x = k * step;
    const h = 76 + hash(k * 2.17 + 6.2) * 52 + Math.sin(k * 1.7) * 12;
    wallTop.push({ x, h });
  }
  const wallGrad = ctx.createLinearGradient(0, -130, 0, 46);
  wallGrad.addColorStop(0, 'rgba(117,109,88,0.78)');
  wallGrad.addColorStop(0.6, 'rgba(84,84,68,0.82)');
  wallGrad.addColorStop(1, 'rgba(64,66,54,0.86)');
  ctx.fillStyle = wallGrad;
  ctx.beginPath();
  ctx.moveTo(wallTop[0].x, 40);
  for (let i = 0; i < wallTop.length; i++) {
    const a = wallTop[i];
    ctx.lineTo(a.x, -a.h);
    ctx.lineTo(a.x + step * 0.62, -a.h + 3);
    ctx.lineTo(a.x + step * 0.72, -a.h + 13);
    ctx.lineTo(a.x + step, -a.h + 5);
  }
  ctx.lineTo(wallTop[wallTop.length - 1].x + step, 40);
  ctx.closePath();
  ctx.fill();

  // arches cut into the wall (dark, with a rare warm interior)
  for (let k = k0; k <= k1; k++) {
    if (hash(k * 5.33 + 2.8) < 0.28) continue;
    const x = k * step + 20;
    const h = 30 + hash(k * 3.1) * 19;
    ctx.fillStyle = 'rgba(36,45,40,0.86)';
    ctx.beginPath();
    ctx.moveTo(x, 18);
    ctx.lineTo(x, -h + 11);
    ctx.quadraticCurveTo(x + 11, -h - 3, x + 22, -h + 11);
    ctx.lineTo(x + 22, 18);
    ctx.closePath();
    ctx.fill();

    if (hash(k * 8.2 + 4.4) > 0.72) {
      const lit = ctx.createLinearGradient(0, -h, 0, 18);
      lit.addColorStop(0, 'rgba(238,181,107,0.24)');
      lit.addColorStop(1, 'rgba(238,181,107,0)');
      ctx.fillStyle = lit;
      ctx.beginPath();
      ctx.moveTo(x + 2, 18);
      ctx.lineTo(x + 2, -h + 11);
      ctx.quadraticCurveTo(x + 11, -h - 1, x + 20, -h + 11);
      ctx.lineTo(x + 20, 18);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,204,133,0.6)';
      ctx.fillRect(x + 9, -h + 8, 2, 2);
    }
  }

  // columns
  for (let k = k0; k <= k1; k++) {
    if (hash(k * 4.73 + 1.9) < 0.47) continue;
    const x = k * step - 4;
    const h = 92 + hash(k * 6.1) * 58;
    ctx.fillStyle = 'rgba(55,65,57,0.86)';
    ctx.fillRect(x, -h, 12 + hash(k) * 7, h + 40);
    ctx.fillStyle = 'rgba(122,132,116,0.18)';
    ctx.fillRect(x, -h, 2, h + 40);
    ctx.fillStyle = 'rgba(36,45,41,0.85)';
    ctx.fillRect(x - 3, -h, 18 + hash(k) * 7, 4);
    if (hash(k * 4.1 + 7.7) > 0.55) {
      ctx.fillStyle = 'rgba(135,92,64,0.25)';
      ctx.fillRect(x + 8, -h + 14 + hash(k) * 30, 2, 20 + hash(k * 2.2) * 40);
    }
  }

  // rust staining down the columns
  ctx.fillStyle = 'rgba(122,84,60,0.13)';
  for (let k = k0; k <= k1; k++) {
    if (hash(k * 6.72 + 9.1) < 0.55) continue;
    const x = k * step + 10 + hash(k * 2.6) * 20;
    ctx.fillRect(x, -72, 1 + hash(k) * 2, 54 + hash(k * 3.2) * 40);
  }

  // a heavy service pipe sagging across the whole arcade
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(61,65,57,0.9)';
  ctx.lineWidth = 12;
  ctx.beginPath();
  for (let x = left - 20; x <= right + 20; x += 20) {
    const y = -35 + Math.sin(x * 0.012 + 1.4) * 5;
    if (x === left - 20) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(122,101,79,0.34)';
  ctx.lineWidth = 5;
  ctx.beginPath();
  for (let x = left - 20; x <= right + 20; x += 20) {
    const y = -38 + Math.sin(x * 0.012 + 1.4) * 5;
    if (x === left - 20) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(44,52,47,0.8)';
  ctx.lineWidth = 1.4;
  for (let x = left; x <= right; x += 31) {
    const y = -35 + Math.sin(x * 0.012 + 1.4) * 5;
    ctx.beginPath();
    ctx.moveTo(x, y - 9);
    ctx.lineTo(x, y + 9);
    ctx.stroke();
  }

  // catwalk railing above the wall
  ctx.strokeStyle = 'rgba(68,82,75,0.7)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = left; x <= right; x += 17) {
    const y = -96 + Math.sin(x * 0.021) * 2;
    ctx.moveTo(x, y);
    ctx.lineTo(x, y - 10);
  }
  ctx.moveTo(left, -105);
  ctx.lineTo(right, -103);
  ctx.stroke();

  // giant broken fan / valve set into the wall
  for (let k = k0; k <= k1; k++) {
    if (hash(k * 12.3 + 6.5) < 0.82) continue;
    const x = k * step + 28;
    const y = -62;
    const rad = 25 + hash(k * 2.2) * 13;
    ctx.strokeStyle = 'rgba(50,61,55,0.75)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x, y, rad, 0, TAU);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(103,111,95,0.22)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x, y, rad - 4, 0, TAU);
    ctx.stroke();
    for (let s = 0; s < 7; s++) {
      const a = s / 7 * TAU;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * 4, y + Math.sin(a) * 4);
      ctx.lineTo(x + Math.cos(a) * (rad - 5), y + Math.sin(a) * (rad - 5));
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(45,56,51,0.8)';
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, TAU);
    ctx.fill();
  }

  // long sagging cables
  ctx.strokeStyle = 'rgba(32,45,42,0.7)';
  ctx.lineWidth = 1.2;
  for (let j = 0; j < 3; j++) {
    const y = -76 - j * 23;
    const x0 = left + 20 + j * 41;
    const x1 = right - 30 - j * 57;
    ctx.beginPath();
    ctx.moveTo(x0, y);
    ctx.bezierCurveTo(x0 + (x1 - x0) * 0.3, y + 20 + j * 5, x0 + (x1 - x0) * 0.7, y + 22 + j * 4, x1, y + 3);
    ctx.stroke();
  }

  // hanging chains
  for (let k = k0; k <= k1; k++) {
    if (hash(k * 7.31 + 6.1) < 0.66) continue;
    const x = k * step + 48;
    const len = 24 + hash(k * 2.1) * 48;
    const sway = Math.sin(worldTime.t * 0.7 + k) * 1.4;
    ctx.strokeStyle = 'rgba(37,50,46,0.6)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, -70);
    ctx.quadraticCurveTo(x + sway, -70 + len * 0.55, x + sway * 2, -70 + len);
    ctx.stroke();
  }

  // pale vertical highlights to suggest wet stone
  ctx.fillStyle = 'rgba(171,185,171,0.06)';
  for (let k = k0; k <= k1; k++) {
    if (hash(k * 9.2) > 0.55) continue;
    const x = k * step + 12;
    ctx.fillRect(x, -78, 1, 82);
  }
  ctx.restore();
}

function drawNearRuins() {
  const f = 0.61;
  const baseY = VH * 0.74 - (cam.y - 225) * 0.38;

  ctx.save();
  ctx.translate(VW / 2 - cam.x * f, baseY);
  const left = cam.x * f - VW / 2 - 260;
  const right = cam.x * f + VW / 2 + 260;

  const step = 146;
  const k0 = Math.floor(left / step) - 1;
  const k1 = Math.ceil(right / step) + 1;

  for (let k = k0; k <= k1; k++) {
    const r = hash(k * 3.41 + 8.2);
    if (r < 0.46) continue;
    const x = k * step + hash(k * 1.2) * 55;
    const h = 60 + hash(k * 2.7 + 1.1) * 100;
    const w = 13 + hash(k * 4.9 + 2.2) * 28;

    // broken pillar / wall stub
    ctx.fillStyle = 'rgba(29,31,25,0.95)';
    ctx.beginPath();
    ctx.moveTo(x, 35);
    ctx.lineTo(x + w * 0.06, -h);
    ctx.lineTo(x + w * 0.37, -h - 8 - hash(k * 5.1) * 15);
    ctx.lineTo(x + w * 0.56, -h + 3);
    ctx.lineTo(x + w * 0.83, -h - 4);
    ctx.lineTo(x + w, 35);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = 'rgba(146,155,130,0.16)';
    ctx.fillRect(x + w * 0.65, -h, 1.5, h);
    ctx.fillStyle = 'rgba(143,91,61,0.20)';
    ctx.fillRect(x + 2, -h + 10, 1.2, h * 0.55);

    // rusted rebar
    ctx.strokeStyle = 'rgba(140,100,71,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x + w * 0.3, -h);
    ctx.lineTo(x + w * 0.24, -h - 13 - hash(k) * 8);
    ctx.stroke();

    // a tall pipe climbing one side
    if (r > 0.78) {
      ctx.strokeStyle = 'rgba(25,32,28,0.9)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x + w * 0.82, 12);
      ctx.lineTo(x + w * 0.82, -h - 18);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(133,96,68,0.3)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x + w * 0.82 - 1, 10);
      ctx.lineTo(x + w * 0.82 - 1, -h - 16);
      ctx.stroke();
    }

    // a dark arch cut through a broad stub
    if (w > 26 && hash(k * 7.2 + 3.1) > 0.55) {
      ctx.fillStyle = 'rgba(19,25,22,0.9)';
      ctx.beginPath();
      ctx.moveTo(x + w * 0.42, 22);
      ctx.lineTo(x + w * 0.42, -h * 0.38);
      ctx.quadraticCurveTo(x + w * 0.65, -h * 0.5, x + w * 0.85, -h * 0.38);
      ctx.lineTo(x + w * 0.85, 22);
      ctx.closePath();
      ctx.fill();
    }

    // hanging chain from above
    if (hash(k * 10.7 + 1.9) > 0.72) {
      const cx = x + w * 0.3;
      const len = 50 + hash(k * 3.1) * 80;
      const sway = Math.sin(worldTime.t * 0.55 + k * 1.7) * 2;
      ctx.strokeStyle = 'rgba(22,29,26,0.85)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx, -VH);
      ctx.bezierCurveTo(cx + sway, -len * 0.4, cx - sway, -len * 0.7, cx + sway, -len);
      ctx.stroke();
      ctx.fillStyle = 'rgba(33,42,37,0.9)';
      for (let j = 1; j < 7; j++) {
        const t = j / 7;
        ctx.beginPath();
        ctx.ellipse(cx + Math.sin(t * 4 + k) * 2.2, -VH + (VH - len) * t, 1.2, 2.2, 0, 0, TAU);
        ctx.fill();
      }
    }

    // a fence segment now and then
    if (hash(k * 6.2 + 5.5) > 0.72) {
      ctx.strokeStyle = 'rgba(25,38,35,0.75)';
      ctx.lineWidth = 0.8;
      const fy = -20, fw = 34;
      ctx.beginPath();
      for (let i = 0; i < 4; i++) {
        ctx.moveTo(x + fw + 6 + i * 5, fy);
        ctx.lineTo(x + fw + 6 + i * 5, fy - 15);
      }
      ctx.moveTo(x + fw + 6, fy - 12);
      ctx.lineTo(x + fw + 24, fy - 12);
      ctx.stroke();
    }

    // vines hanging from the pillar
    if (hash(k * 7.7 + 2.4) > 0.5) {
      const vx = x + w * 0.2;
      const len = 20 + hash(k * 3.3) * 46;
      ctx.strokeStyle = 'rgba(40,58,46,0.7)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(vx, -h * 0.65);
      ctx.bezierCurveTo(vx + 4, -h * 0.45, vx - 4, -h * 0.3, vx + 1, -h * 0.65 + len);
      ctx.stroke();
      ctx.fillStyle = 'rgba(51,70,53,0.65)';
      for (let i = 1; i <= 3; i++) {
        const t = i / 4;
        const yy = -h * 0.65 + len * t;
        ctx.beginPath();
        ctx.ellipse(vx + (i % 2 ? 2 : -2), yy, 2.5, 1.2, i % 2 ? 0.5 : -0.5, 0, TAU);
        ctx.fill();
      }
    }
  }
  ctx.restore();
}

function drawViaduct() {
  const f = 0.46;
  const baseY = VH * 0.69 - (cam.y - 225) * 0.28;

  ctx.save();
  ctx.translate(VW / 2 - cam.x * f, baseY);
  const left = cam.x * f - VW / 2 - 190;
  const right = cam.x * f + VW / 2 + 190;
  const step = 156;
  const k0 = Math.floor(left / step) - 1;
  const k1 = Math.ceil(right / step) + 1;

  // the long broken wall
  ctx.beginPath();
  ctx.moveTo(left - 40, 40);
  for (let x = left - 40; x <= right + 40; x += 16) {
    const base = 102 + Math.sin(x * 0.008 + 1.7) * 5;
    const broken = hash(Math.floor(x / 27) * 1.7 + 3.1) > 0.83
      ? 10 + hash(x * 0.7) * 16
      : 0;
    ctx.lineTo(x, -(base - broken));
  }
  ctx.lineTo(right + 40, 40);
  ctx.closePath();
  const wallGrad = ctx.createLinearGradient(0, -130, 0, 30);
  wallGrad.addColorStop(0, 'rgba(78,76,60,0.95)');
  wallGrad.addColorStop(1, 'rgba(45,48,38,0.97)');
  ctx.fillStyle = wallGrad;
  ctx.fill();

  // columns and cornice
  ctx.fillStyle = 'rgba(87,84,66,0.9)';
  for (let k = k0; k <= k1; k++) {
    const x = k * step;
    ctx.fillRect(x, -112, 20, 150);
    ctx.fillStyle = 'rgba(125,120,94,0.13)';
    ctx.fillRect(x + 1, -112, 2.5, 150);
    ctx.fillStyle = 'rgba(87,84,66,0.9)';
  }
  ctx.fillStyle = 'rgba(61,60,48,0.95)';
  ctx.fillRect(left - 60, -106, right - left + 120, 5);
  ctx.fillStyle = 'rgba(120,113,88,0.14)';
  ctx.fillRect(left - 60, -106, right - left + 120, 1.2);

  // arched openings
  for (let k = k0; k <= k1; k++) {
    const x = k * step;
    const aw = 88;
    const ah = 66 + hash(k * 2.3) * 24;
    const y0 = 16;
    ctx.fillStyle = 'rgba(22,28,24,0.9)';
    ctx.beginPath();
    ctx.moveTo(x + 34, y0);
    ctx.lineTo(x + 34, y0 - ah + 20);
    ctx.quadraticCurveTo(x + 34 + aw / 2, y0 - ah - 9, x + 34 + aw, y0 - ah + 20);
    ctx.lineTo(x + 34 + aw, y0);
    ctx.closePath();
    ctx.fill();

    if (hash(k * 7.7 + 2.1) > 0.68) {
      const lit = ctx.createLinearGradient(0, y0 - ah, 0, y0);
      lit.addColorStop(0, 'rgba(216,166,104,0.18)');
      lit.addColorStop(1, 'rgba(216,166,104,0)');
      ctx.fillStyle = lit;
      ctx.beginPath();
      ctx.moveTo(x + 38, y0);
      ctx.lineTo(x + 38, y0 - ah + 20);
      ctx.quadraticCurveTo(x + 34 + aw / 2, y0 - ah - 7, x + 34 + aw - 4, y0 - ah + 20);
      ctx.lineTo(x + 34 + aw - 4, y0);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(247,199,128,0.5)';
      ctx.fillRect(x + 34 + aw / 2 - 1, y0 - ah + 22, 2, 2);
    }

    // hanging vines inside the arch
    if (hash(k * 8.9 + 6.3) > 0.55) {
      const vx = x + 46 + hash(k * 3.1) * 46;
      const vl = 12 + hash(k * 4.7) * 36;
      ctx.strokeStyle = 'rgba(39,57,42,0.7)';
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.moveTo(vx, y0 - ah + 20);
      ctx.quadraticCurveTo(vx + 3, y0 - ah + 20 + vl * 0.5, vx - 1, y0 - ah + 20 + vl);
      ctx.stroke();
      ctx.fillStyle = 'rgba(48,67,47,0.7)';
      ctx.beginPath();
      ctx.ellipse(vx - 1, y0 - ah + 20 + vl, 1.7, 0.9, 0.4, 0, TAU);
      ctx.fill();
    }
  }

  // weeds along the top
  ctx.strokeStyle = 'rgba(51,69,46,0.7)';
  ctx.lineWidth = 0.8;
  for (let x = left; x < right; x += 13) {
    if (hash(x * 0.61 + 4.4) < 0.4) continue;
    const y = -96 - hash(x * 0.3) * 20;
    const gh = 3 + hash(x * 1.7) * 8;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + 1, y - gh * 0.5, x + 2.5 + Math.sin(worldTime.t + x) * 1.2, y - gh);
    ctx.stroke();
  }

  ctx.restore();
}

function drawOverhang() {
  const f = 0.84;
  ctx.save();
  ctx.translate(VW / 2 - cam.x * f, -(cam.y - 225) * 0.35);

  const left = cam.x * f - VW / 2 - 160;
  const right = cam.x * f + VW / 2 + 160;
  const step = 380;
  const k0 = Math.floor(left / step) - 1;
  const k1 = Math.ceil(right / step) + 1;

  // hanging cables and chains, thin against the sky
  ctx.lineCap = 'round';
  for (let k = k0; k <= k1; k++) {
    if (hash(k * 4.7 + 1.3) < 0.3) continue;
    const x = k * step + hash(k * 2.2) * 160;
    const len = 30 + hash(k * 5.5) * 110;
    const sway = Math.sin(worldTime.t * 0.5 + k * 1.4) * 3;
    ctx.strokeStyle = 'rgba(16,24,20,0.9)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x, -30);
    ctx.bezierCurveTo(x + sway * 0.5, len * 0.25, x - sway, len * 0.65, x + sway, len);
    ctx.stroke();

    if (hash(k * 8.1 + 2.7) > 0.58) {
      // a little hanging lamp
      const ly = len + 4;
      ctx.strokeStyle = 'rgba(17,25,21,0.9)';
      ctx.beginPath();
      ctx.moveTo(x + sway, ly - 4);
      ctx.lineTo(x + sway, ly);
      ctx.stroke();
      ctx.fillStyle = 'rgba(70,67,48,0.9)';
      ctx.beginPath();
      ctx.ellipse(x + sway, ly + 1, 3.2, 2, 0, 0, TAU);
      ctx.fill();
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      const halo = ctx.createRadialGradient(x + sway, ly + 1, 0.5, x + sway, ly + 1, 22);
      halo.addColorStop(0, 'rgba(240,189,112,0.18)');
      halo.addColorStop(1, 'rgba(240,189,112,0)');
      ctx.fillStyle = halo;
      ctx.fillRect(x + sway - 24, ly - 23, 48, 48);
      ctx.restore();
      ctx.fillStyle = 'rgba(255,209,139,0.55)';
      ctx.fillRect(x + sway - 0.8, ly + 0.4, 1.6, 1.2);
    }
  }

  // huge broken slab intruding from the upper-left
  ctx.fillStyle = 'rgba(14,22,18,0.96)';
  ctx.beginPath();
  ctx.moveTo(left - 40, -80);
  ctx.lineTo(left + 210, -80);
  ctx.lineTo(left + 190, 16);
  ctx.lineTo(left + 150, 34);
  ctx.lineTo(left + 112, 24);
  ctx.lineTo(left + 80, 58);
  ctx.lineTo(left + 40, 28);
  ctx.lineTo(left - 40, 58);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(105,87,62,0.16)';
  ctx.beginPath();
  ctx.moveTo(left + 40, 28);
  ctx.lineTo(left + 80, 58);
  ctx.lineTo(left + 84, 38);
  ctx.closePath();
  ctx.fill();
  // rebar dangling from the slab
  ctx.strokeStyle = 'rgba(117,85,59,0.42)';
  ctx.lineWidth = 0.9;
  for (let i = 0; i < 5; i++) {
    const x = left + 50 + i * 30;
    const len = 9 + hash(i * 3.7) * 21;
    ctx.beginPath();
    ctx.moveTo(x, 28 + hash(i) * 12);
    ctx.quadraticCurveTo(x + 3, 28 + len * 0.6, x - 2 + hash(i) * 4, 28 + len);
    ctx.stroke();
  }

  // a massive pipe elbow hanging in from the upper-right
  ctx.fillStyle = 'rgba(15,23,19,0.97)';
  ctx.beginPath();
  ctx.moveTo(right + 30, -90);
  ctx.lineTo(right - 250, -90);
  ctx.lineTo(right - 240, -18);
  ctx.lineTo(right - 190, 12);
  ctx.lineTo(right - 155, 44);
  ctx.lineTo(right - 100, 40);
  ctx.lineTo(right - 70, 68);
  ctx.lineTo(right - 20, 74);
  ctx.lineTo(right + 30, 40);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(137,105,76,0.2)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(right - 240, -18);
  ctx.quadraticCurveTo(right - 180, -8, right - 160, 38);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(18,27,22,0.95)';
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(right - 230, -22);
  ctx.quadraticCurveTo(right - 170, -12, right - 152, 36);
  ctx.stroke();

  // a few big foreground leaves hanging from the dark masses
  for (let i = 0; i < 5; i++) {
    const x = left + 90 + i * 35;
    const y = 26 + hash(i * 6.3) * 24;
    const len = 16 + hash(i * 2.9) * 22;
    const sway = Math.sin(worldTime.t * 0.7 + i) * 2;
    ctx.strokeStyle = 'rgba(11,19,14,0.95)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + 2, y + len * 0.6, x + sway, y + len);
    ctx.stroke();
    ctx.fillStyle = 'rgba(12,22,15,0.95)';
    for (let j = 1; j <= 3; j++) {
      const t = j / 4;
      ctx.beginPath();
      ctx.ellipse(x + sway * t + (j % 2 ? 3 : -3), y + len * t, 3.8, 1.3, j % 2 ? 0.5 : -0.5, 0, TAU);
      ctx.fill();
    }
  }

  ctx.restore();
}

function drawForegroundVines() {
  // dark hanging curtains, only near the upper corners
  const f = 1.12;
  ctx.save();
  ctx.translate(VW / 2 - cam.x * f, -cam.y * f * 0.1 + VH * 0.06);
  const left = cam.x * f - VW / 2 - 200;
  const right = cam.x * f + VW / 2 + 200;
  const step = 330;
  const k0 = Math.floor(left / step) - 1;
  const k1 = Math.ceil(right / step) + 1;
  for (let k = k0; k <= k1; k++) {
    if (hash(k * 4.11 + 2.3) < 0.42) continue;
    const x = k * step + hash(k * 2.7) * 190;
    const len = 35 + hash(k * 5.9) * 95;
    const sway = Math.sin(worldTime.t * 0.6 + k * 2.1) * 3;
    ctx.strokeStyle = 'rgba(14,22,19,0.8)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(x, -20);
    ctx.bezierCurveTo(x - 6, len * 0.25, x + 10 + sway, len * 0.6, x + sway, len);
    ctx.stroke();
    ctx.fillStyle = 'rgba(16,26,21,0.8)';
    for (let i = 1; i < 5; i++) {
      const t = i / 5;
      const yy = len * t;
      const xx = x + Math.sin(t * 4 + k) * 5 + sway * t;
      ctx.beginPath();
      ctx.ellipse(xx + (i % 2 ? 3 : -3), yy, 4.5, 1.7, i % 2 ? 0.6 : -0.6, 0, TAU);
      ctx.fill();
    }
  }
  ctx.restore();
}

// ------------------------------------------------------------- terrain art

function drawMushroom(x, s) {
  const y = groundY(x);
  const h = (7 + hash(x * 0.37) * 8) * s;
  const glow = ctx.createRadialGradient(x, y - h, 1, x, y - h, 30 * s);
  glow.addColorStop(0, 'rgba(255,192,116,0.12)');
  glow.addColorStop(0.45, 'rgba(244,160,92,0.05)');
  glow.addColorStop(1, 'rgba(244,160,92,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(x - 32 * s, y - h - 32 * s, 64 * s, 64 * s);

  ctx.strokeStyle = 'rgba(60,65,52,0.9)';
  ctx.lineWidth = 1.2 * s;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.quadraticCurveTo(x - 1, y - h * 0.55, x + 1, y - h);
  ctx.stroke();

  ctx.fillStyle = 'rgba(83,82,60,0.9)';
  ctx.beginPath();
  ctx.ellipse(x + 1, y - h, 3.7 * s, 1.9 * s, -0.1, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(137,128,91,0.8)';
  ctx.beginPath();
  ctx.ellipse(x + 0.4, y - h - 0.5, 2.9 * s, 1.0 * s, -0.1, 0, TAU);
  ctx.fill();

  ctx.fillStyle = 'rgba(186,173,131,0.55)';
  ctx.beginPath();
  ctx.arc(x + 2, y - h - 1.2, 0.75 * s, 0, TAU);
  ctx.fill();
}

function drawGrassTuft(x, size, alpha) {
  const y = groundY(x);
  const sway = Math.sin(worldTime.t * 1.25 + x * 0.045) * 1.3 + Math.sin(worldTime.t * 0.31) * 0.8;
  const blades = 3 + Math.floor(hash(x * 0.73) * 4);
  for (let i = 0; i < blades; i++) {
    const bx = x + (hash(x * 1.91 + i * 3.7) - 0.5) * 10;
    const h = (5 + hash(x * 2.7 + i * 8.1) * 10) * size;
    const lean = (hash(x * 4.3 + i) - 0.5) * 6;
    ctx.strokeStyle = i % 3 === 0 ? `rgba(144,151,104,${alpha * 0.7})` : `rgba(73,87,56,${alpha})`;
    ctx.lineWidth = 0.8 + hash(x + i) * 0.7;
    ctx.beginPath();
    ctx.moveTo(bx, y + 1);
    ctx.quadraticCurveTo(bx + lean * 0.25, y - h * 0.5, bx + lean + sway, y - h);
    ctx.stroke();
  }
}

function drawGround(x0, x1) {
  const bottom = VH + 100;

  // body of the earth
  const earth = ctx.createLinearGradient(0, TERRAIN_BASE - 20, 0, VH + 30);
  earth.addColorStop(0, '#2f3127');
  earth.addColorStop(0.18, '#20231b');
  earth.addColorStop(1, '#0b0f0b');
  ctx.fillStyle = earth;
  ctx.beginPath();
  ctx.moveTo(x0, bottom);
  for (let x = x0; x <= x1; x += 2) ctx.lineTo(x, groundY(x));
  ctx.lineTo(x1, bottom);
  ctx.closePath();
  ctx.fill();

  // wet stone band just below the surface
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(55,58,43,0.95)';
  ctx.lineWidth = 9;
  ctx.beginPath();
  for (let x = x0; x <= x1; x += 3) {
    const y = groundY(x) + 5;
    if (x === x0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // strata
  for (const [depth, alpha, color] of [[18, 0.19, '#3b3c2c'], [35, 0.12, '#33352a'], [60, 0.09, '#2c3025']]) {
    ctx.strokeStyle = color;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let x = x0; x <= x1; x += 4) {
      const y = groundY(x) + depth + Math.sin(x * 0.031 + depth) * 2.5;
      if (x === x0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // cracks
  for (let k = Math.floor(x0 / 80) - 1; k <= Math.ceil(x1 / 80) + 1; k++) {
    if (hash(k * 3.61 + 1.1) < 0.62) continue;
    const x = k * 80 + hash(k * 1.7) * 60;
    const y = groundY(x);
    ctx.strokeStyle = 'rgba(8,14,12,0.42)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(x, y + 4);
    ctx.lineTo(x + (hash(k) - 0.5) * 6, y + 12 + hash(k * 2.2) * 18);
    ctx.stroke();
  }

  // mossy cap
  ctx.strokeStyle = 'rgba(94,105,72,0.95)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (let x = x0; x <= x1; x += 3) {
    const y = groundY(x);
    if (x === x0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(158,168,122,0.42)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = x0; x <= x1; x += 3) {
    const y = groundY(x) - 0.8;
    if (x === x0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // puddles
  for (let k = Math.floor(x0 / 250) - 1; k <= Math.ceil(x1 / 250) + 1; k++) {
    if (hash(k * 4.27 + 3.1) < 0.45) continue;
    const x = k * 250 + hash(k * 2.2) * 140;
    if (Math.abs(groundSlope(x)) > 0.10) continue;
    const w = 14 + hash(k * 5.1) * 26;
    const y = groundY(x) + 1.2;
    ctx.fillStyle = 'rgba(28,38,36,0.55)';
    ctx.beginPath();
    ctx.ellipse(x, y, w, 2.1 + w * 0.04, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(188,199,181,0.18)';
    ctx.fillRect(x - w * 0.55, y - 0.8, w * 0.62, 0.8);
    ctx.fillStyle = 'rgba(236,218,183,0.10)';
    ctx.fillRect(x + w * 0.1, y - 1.2, w * 0.25, 0.55);
    ctx.strokeStyle = 'rgba(115,133,119,0.2)';
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.ellipse(x, y, w, 2.1 + w * 0.04, 0, 0, TAU);
    ctx.stroke();
  }

  // wet glints in flat places
  for (let k = Math.floor(x0 / 130) - 1; k <= Math.ceil(x1 / 130) + 1; k++) {
    if (hash(k * 2.63 + 8.1) < 0.55) continue;
    const x = k * 130 + hash(k * 3.3) * 90;
    if (Math.abs(groundSlope(x)) > 0.12) continue;
    const w = 6 + hash(k * 5.1) * 13;
    ctx.fillStyle = 'rgba(170,184,156,0.14)';
    ctx.fillRect(x - w * 0.5, groundY(x) + 0.9, w * 0.55, 0.7);
  }

  // little pale flowers and rusted scrap
  for (let k = Math.floor(x0 / 95) - 1; k <= Math.ceil(x1 / 95) + 1; k++) {
    const r = hash(k * 7.13 + 2.4);
    if (r < 0.56) continue;
    const x = k * 95 + hash(k * 2.7) * 60;
    const y = groundY(x);
    if (r > 0.87) {
      // scrap plate
      ctx.fillStyle = 'rgba(78,65,50,0.55)';
      ctx.beginPath();
      ctx.moveTo(x, y + 1);
      ctx.lineTo(x + 8 + hash(k) * 6, y - 1);
      ctx.lineTo(x + 12 + hash(k * 2.2) * 6, y + 1.6);
      ctx.lineTo(x + 2, y + 2.4);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(142,100,68,0.3)';
      ctx.lineWidth = 0.6;
      ctx.stroke();
    } else if (r < 0.72) {
      // flower
      const h = 4 + hash(k * 1.9) * 6;
      ctx.strokeStyle = 'rgba(97,116,78,0.65)';
      ctx.lineWidth = 0.55;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x - 1, y - h * 0.5, x + 0.5, y - h);
      ctx.stroke();
      ctx.fillStyle = 'rgba(224,220,190,0.55)';
      ctx.beginPath();
      ctx.arc(x + 0.5, y - h, 0.9, 0, TAU);
      ctx.fill();
    }
  }

  // buried boulders and rubble in the cross-section
  for (let k = Math.floor(x0 / 82) - 1; k <= Math.ceil(x1 / 82) + 1; k++) {
    const r = hash(k * 5.17 + 6.2);
    if (r < 0.48) continue;
    const x = k * 82 + hash(k * 2.4) * 60;
    const depth = 12 + hash(k * 3.3) * 65;
    const y = groundY(x) + depth;
    const rx = 3 + hash(k * 4.1) * 9;
    const ry = rx * (0.5 + hash(k * 6.2) * 0.4);
    ctx.fillStyle = `rgba(55,57,44,${0.45 + r * 0.25})`;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, hash(k) * 1.2, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(128,129,96,0.12)';
    ctx.beginPath();
    ctx.ellipse(x - rx * 0.15, y - ry * 0.35, rx * 0.7, ry * 0.35, hash(k) * 1.2, 0, TAU);
    ctx.fill();
  }

  // old pipes embedded in the bank
  for (let k = Math.floor(x0 / 330) - 1; k <= Math.ceil(x1 / 330) + 1; k++) {
    if (hash(k * 7.37 + 5.1) < 0.5) continue;
    const x = k * 330 + 30 + hash(k * 2.4) * 220;
    const y = groundY(x) + 18 + hash(k * 3.6) * 28;
    const w = 24 + hash(k * 4.4) * 40;
    ctx.strokeStyle = 'rgba(39,41,33,0.8)';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w, y + Math.sin(k) * 2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(117,92,65,0.25)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(x, y - 1.2);
    ctx.lineTo(x + w, y - 1.2 + Math.sin(k) * 2);
    ctx.stroke();
  }

  // weathered pipe openings / burrows in the bank
  for (let k = Math.floor(x0 / 540) - 1; k <= Math.ceil(x1 / 540) + 1; k++) {
    if (hash(k * 8.41 + 4.6) < 0.58) continue;
    const x = k * 540 + 80 + hash(k * 2.8) * 300;
    if (Math.abs(groundSlope(x)) > 0.2) continue;
    const y = groundY(x) + 2;
    ctx.fillStyle = 'rgba(11,16,13,0.9)';
    ctx.beginPath();
    ctx.ellipse(x, y + 6, 11 + hash(k * 3.3) * 8, 12 + hash(k * 4.2) * 9, 0.1, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(108,92,64,0.35)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.ellipse(x, y + 6, 11 + hash(k * 3.3) * 8, 12 + hash(k * 4.2) * 9, 0.1, Math.PI, TAU);
    ctx.stroke();
    ctx.fillStyle = 'rgba(26,33,27,0.6)';
    ctx.fillRect(x - 15, y + 1, 30, 2);
  }

  // rocks and roots
  for (let k = Math.floor(x0 / 54) - 1; k <= Math.ceil(x1 / 54) + 1; k++) {
    const r = hash(k * 4.93 + 2.2);
    if (r < 0.52) continue;
    const x = k * 54 + hash(k * 1.3) * 30;
    const y = groundY(x);
    if (r > 0.84) {
      // root / dead branch
      ctx.strokeStyle = 'rgba(39,45,34,0.85)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x, y + 1);
      ctx.bezierCurveTo(x + 5, y - 2, x + 8, y - 4, x + 12, y - 7);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + 5, y - 2);
      ctx.lineTo(x + 3, y - 7);
      ctx.stroke();
    } else {
      const w = 2.5 + hash(k * 2.1) * 5;
      ctx.fillStyle = 'rgba(40,51,45,0.9)';
      ctx.beginPath();
      ctx.ellipse(x, y + 1, w, w * 0.45, 0, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(126,142,120,0.18)';
      ctx.beginPath();
      ctx.ellipse(x - w * 0.2, y - 0.2, w * 0.55, w * 0.18, 0, 0, TAU);
      ctx.fill();
    }
  }

  // grass
  for (let x = Math.floor(x0 / 9) * 9; x <= x1; x += 9) {
    const r = hash(x * 0.63 + 4.2);
    if (r < 0.28) continue;
    drawGrassTuft(x + r * 5, 0.7 + hash(x * 2.3) * 1.05, 0.52 + r * 0.32);
  }
  for (let k = Math.floor(x0 / 190) - 1; k <= Math.ceil(x1 / 190) + 1; k++) {
    if (hash(k * 6.13 + 3.4) < 0.62) continue;
    const x = k * 190 + hash(k * 2.1) * 120;
    drawGrassTuft(x, 1.55 + hash(k * 3.7) * 0.7, 0.6);
  }

  // lantern fungus
  for (let k = Math.floor(x0 / 430) - 1; k <= Math.ceil(x1 / 430) + 1; k++) {
    if (hash(k * 7.73 + 1.7) < 0.34) continue;
    const x = k * 430 + 60 + hash(k * 2.9) * 300;
    if (x < x0 - 10 || x > x1 + 10) continue;
    drawMushroom(x, 0.8 + hash(k * 4.2) * 0.65);
  }
}

function drawPlatform(p, nearPlayer) {
  const topCol = p.style === 'girder' ? '#3b3f33' : '#45463a';
  const edgeCol = p.style === 'girder' ? 'rgba(166,166,119,0.55)' : 'rgba(150,151,116,0.4)';

  // hanging chains / support cables, above the deck
  ctx.strokeStyle = 'rgba(29,35,29,0.6)';
  ctx.lineWidth = 1;
  for (const ox of [p.x + 6, p.x + p.w - 6]) {
    const sag = Math.sin(worldTime.t * 0.8 + p.seed * 7 + ox) * 1.2;
    ctx.beginPath();
    ctx.moveTo(ox, p.y - 2);
    ctx.quadraticCurveTo(ox + sag, p.y - 80, ox + sag * 1.7, p.y - 170);
    ctx.stroke();
  }

  // deck shadow
  ctx.fillStyle = 'rgba(7,12,10,0.28)';
  ctx.beginPath();
  ctx.ellipse(p.x + p.w * 0.5, p.y + 12, p.w * 0.55, 3, 0, 0, TAU);
  ctx.fill();

  if (p.style === 'girder') {
    ctx.fillStyle = topCol;
    ctx.fillRect(p.x, p.y, p.w, 6);
    ctx.fillStyle = '#283630';
    ctx.fillRect(p.x, p.y + 6, p.w, 4);
    // cross braces
    ctx.strokeStyle = 'rgba(33,46,40,0.95)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let x = p.x + 4; x < p.x + p.w - 4; x += 14) {
      ctx.moveTo(x, p.y + 6);
      ctx.lineTo(x + 7, p.y + 13);
      ctx.moveTo(x + 7, p.y + 6);
      ctx.lineTo(x, p.y + 13);
    }
    ctx.stroke();
    // rust
    ctx.fillStyle = 'rgba(138,95,64,0.24)';
    for (let i = 0; i < 3; i++) {
      const rx = p.x + 8 + hash(p.seed + i * 4.1) * (p.w - 16);
      ctx.fillRect(rx, p.y + 1 + hash(p.seed + i) * 5, 2 + hash(p.seed + i * 3) * 5, 1);
    }
    // rivets
    ctx.fillStyle = 'rgba(166,177,153,0.2)';
    for (let x = p.x + 8; x < p.x + p.w; x += 12) ctx.fillRect(x, p.y + 2, 1, 1);
  } else {
    ctx.fillStyle = topCol;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y + 1);
    ctx.lineTo(p.x + p.w * 0.14, p.y - 1.5);
    ctx.lineTo(p.x + p.w * 0.42, p.y);
    ctx.lineTo(p.x + p.w * 0.67, p.y - 2);
    ctx.lineTo(p.x + p.w, p.y);
    ctx.lineTo(p.x + p.w - 2, p.y + 7);
    ctx.lineTo(p.x + p.w * 0.74, p.y + 11);
    ctx.lineTo(p.x + p.w * 0.32, p.y + 8);
    ctx.lineTo(p.x, p.y + 7);
    ctx.closePath();
    ctx.fill();
    // rebar
    ctx.strokeStyle = 'rgba(112,82,58,0.55)';
    ctx.lineWidth = 0.9;
    for (let i = 0; i < 3; i++) {
      const rx = p.x + 9 + i * (p.w - 18) / 3;
      ctx.beginPath();
      ctx.moveTo(rx, p.y + 8);
      ctx.quadraticCurveTo(rx - 2, p.y + 13, rx + 1, p.y + 15 + hash(i + p.seed) * 4);
      ctx.stroke();
    }
  }

  // mossy top edge
  ctx.strokeStyle = edgeCol;
  ctx.lineWidth = nearPlayer ? 1.7 : 1.2;
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x + p.w, p.y);
  ctx.stroke();

  // grass tufts along the edge
  for (let i = 0; i < 4; i++) {
    if (hash(p.seed + i * 3.7) < 0.5) continue;
    const gx = p.x + 6 + hash(p.seed + i * 1.9) * (p.w - 12);
    const gh = 3 + hash(p.seed + i) * 5;
    ctx.strokeStyle = 'rgba(66,86,66,0.85)';
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(gx, p.y);
    ctx.quadraticCurveTo(gx + 1, p.y - gh * 0.5, gx + 2 + Math.sin(worldTime.t + gx) * 1.5, p.y - gh);
    ctx.stroke();
  }

  // vines
  if (hash(p.seed * 4.4 + 1.2) > 0.35) {
    const vx = hash(p.seed * 2.6) > 0.5 ? p.x + 3 : p.x + p.w - 3;
    const len = 8 + hash(p.seed * 8.1) * 18;
    ctx.strokeStyle = 'rgba(42,64,46,0.8)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(vx, p.y + 3);
    ctx.bezierCurveTo(vx + 3, p.y + len * 0.4, vx - 3, p.y + len * 0.7, vx + 1, p.y + len);
    ctx.stroke();
    ctx.fillStyle = 'rgba(54,78,54,0.8)';
    ctx.beginPath();
    ctx.ellipse(vx + 1, p.y + len, 2, 1, 0.4, 0, TAU);
    ctx.fill();
  }
}

// ======================================================================
//  weather, particles, small life
// ======================================================================

const particles = [];
const ripples = [];
const rain = [];
const motes = [];
const flies = [];
let bolt = null;

function spawnDust(x, y, n = 4, power = 1, wet = true) {
  for (let i = 0; i < n; i++) {
    particles.push({
      kind: 'dust',
      x: x + rand(-4, 4),
      y: y - rand(0, 2),
      vx: rand(-28, 28) * power + Math.sin(worldTime.t * 0.7) * 6,
      vy: -rand(6, 34) * power,
      life: rand(0.25, 0.6) * (0.7 + power * 0.3),
      max: 0.65,
      r: rand(0.9, 2.4) * (0.7 + power * 0.25),
      wet,
    });
  }
}

function spawnSplash(x, y, n = 3, power = 1) {
  for (let i = 0; i < n; i++) {
    particles.push({
      kind: 'drop',
      x: x + rand(-5, 5),
      y: y - 0.5,
      vx: rand(-35, 35) * power,
      vy: -rand(18, 68) * power,
      life: rand(0.2, 0.4),
      max: 0.4,
      r: rand(0.5, 1.2),
      wet: true,
    });
  }
}

function spawnRipple(x, y, strength = 1) {
  if (ripples.length > 70) return;
  ripples.push({ x, y, t: 0, life: 0.5 + Math.random() * 0.25, s: 0.6 + strength * 0.7 });
}

function resetAmbient() {
  rain.length = 0;
  motes.length = 0;
  flies.length = 0;
  particles.length = 0;
  ripples.length = 0;

  const count = Math.floor(VW * 0.46);
  for (let i = 0; i < count; i++) {
    rain.push({
      x: Math.random() * VW,
      y: Math.random() * VH,
      z: Math.random(),
      vy: 110 + Math.random() * 150,
      len: 3 + Math.random() * 8,
      a: 0.06 + Math.random() * 0.16,
    });
  }

  for (let i = 0; i < 26; i++) {
    motes.push({
      x: rand(-VW * 0.7, VW * 0.7),
      y: rand(-VH * 0.4, VH * 0.25),
      vx: rand(-2, 2),
      vy: rand(-3, 2),
      phase: Math.random() * TAU,
      r: rand(0.4, 1.2),
      a: rand(0.12, 0.4),
    });
  }

  for (let i = 0; i < 7; i++) {
    flies.push({
      x: rand(-VW * 0.6, VW * 0.6),
      y: rand(-VH * 0.3, -10),
      vx: 0, vy: 0,
      phase: Math.random() * TAU,
      speed: rand(0.4, 1),
      size: rand(0.7, 1.2),
    });
  }
}

function updateWeather(dt) {
  worldTime.t += dt;
  const wind = Math.sin(worldTime.t * 0.17) * 9 + Math.sin(worldTime.t * 0.043 + 1.7) * 16;
  worldTime.wind = wind;

  // lightning
  worldTime.lightningIn -= dt;
  if (worldTime.lightningIn <= 0) {
    worldTime.lightningIn = 19 + Math.random() * 24;
    cam.flash = 1;
    bolt = makeBolt();
    setTimeout(() => audio.thunder(), 500 + Math.random() * 1200);
  }
  cam.flash = Math.max(0, cam.flash - dt * 2.8);

  // rain
  for (const d of rain) {
    d.y += d.vy * dt * (0.65 + d.z * 0.6);
    d.x += (wind * 0.55 + 17) * dt * (0.4 + d.z);
    if (d.y > VH + 12) {
      d.y = -12 - Math.random() * 30;
      d.x = Math.random() * (VW + 120) - 60;
    }
    if (d.x > VW + 30) d.x -= VW + 60;
    if (d.x < -30) d.x += VW + 60;
  }

  // rain striking the ground
  const camL = cam.x - VW / 2;
  const camR = cam.x + VW / 2;
  for (let i = 0; i < 2; i++) {
    if (Math.random() < 0.75) {
      const x = camL + Math.random() * (camR - camL);
      const gy = groundY(x);
      const sy = VH / 2 + (gy - cam.y);
      if (sy > 12 && sy < VH + 10) {
        spawnRipple(x, gy, 0.55 + Math.random() * 0.7);
        if (Math.random() < 0.35) spawnSplash(x, gy, 1, 0.4);
      }
    }
  }

  // motes drift around the slugcat, world-space
  for (const m of motes) {
    m.phase += dt * 0.7;
    m.x += (m.vx + Math.sin(m.phase) * 3 + wind * 0.02) * dt;
    m.y += (m.vy + Math.cos(m.phase * 0.7) * 2) * dt;
    if (m.y < -VH * 0.5) m.y = VH * 0.25;
    if (m.x < -VW * 0.8) m.x = VW * 0.8;
    if (m.x > VW * 0.8) m.x = -VW * 0.8;
  }

  // batflies
  for (const f of flies) {
    const wx = cam.x + f.x;
    const wy = cam.y + f.y;
    const dx = player.x - wx;
    const dy = player.y - wy;
    const d = Math.hypot(dx, dy);
    if (d < 58) {
      const k = (58 - d) / 58;
      f.vx -= dx / (d || 1) * 160 * k * dt;
      f.vy -= dy / (d || 1) * 160 * k * dt;
    }
    f.vx += (Math.sin(f.phase * 1.7) * 6 - f.vx) * dt * 1.6;
    f.vy += (Math.cos(f.phase * 1.3) * 4 - f.vy) * dt * 1.6;
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    f.phase += dt * (1.2 + f.speed);

    if (f.x < -VW * 0.7 || f.x > VW * 0.7 || f.y < -VH * 0.55 || f.y > -6) {
      f.x = rand(-VW * 0.55, VW * 0.55);
      f.y = rand(-VH * 0.42, -20);
      f.vx = f.vy = 0;
    }
  }

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    if (p.kind === 'drop') {
      p.vy += 420 * dt;
      p.vx *= 1 - 1.8 * dt;
    } else {
      p.vy += 18 * dt;
      p.vx *= 1 - 1.3 * dt;
      p.vy *= 1 - 0.7 * dt;
    }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }

  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.t += dt;
    if (r.t >= r.life) ripples.splice(i, 1);
  }
}

function makeBolt() {
  const pts = [];
  let x = VW * (0.25 + Math.random() * 0.5);
  let y = -10;
  const endY = VH * 0.36;
  while (y < endY) {
    pts.push({ x, y });
    x += rand(-16, 16);
    y += rand(9, 22);
  }
  const branches = [];
  for (let i = 1; i < pts.length - 1; i += 2) {
    if (Math.random() < 0.65) {
      const b = [pts[i]];
      let bx = pts[i].x, by = pts[i].y;
      for (let j = 0; j < 4; j++) {
        bx += rand(-18, 12);
        by += rand(5, 12);
        b.push({ x: bx, y: by });
      }
      branches.push(b);
    }
  }
  return { pts, branches };
}

function drawWeatherSky() {
  if (!bolt || cam.flash <= 0.01) return;
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.strokeStyle = `rgba(214,231,222,${cam.flash * 0.5})`;
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  for (let i = 0; i < bolt.pts.length; i++) {
    const p = bolt.pts[i];
    if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();
  ctx.lineWidth = 0.8;
  for (const b of bolt.branches) {
    ctx.beginPath();
    for (let i = 0; i < b.length; i++) {
      if (i === 0) ctx.moveTo(b[i].x, b[i].y); else ctx.lineTo(b[i].x, b[i].y);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawRipples() {
  for (const r of ripples) {
    const k = r.t / r.life;
    const e = 1 - (1 - k) * (1 - k);
    const w = (1.5 + e * 9) * r.s;
    ctx.strokeStyle = `rgba(156,180,166,${(1 - k) * 0.35})`;
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.ellipse(r.x, r.y + 0.4, w, Math.max(0.4, w * 0.2), groundSlope(r.x) * 0.5, 0, TAU);
    ctx.stroke();
  }
}

function drawMotes() {
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (const m of motes) {
    const x = cam.x + m.x;
    const y = cam.y + m.y;
    ctx.fillStyle = `rgba(190,220,191,${m.a * (0.5 + 0.5 * Math.sin(m.phase * 2))})`;
    ctx.beginPath();
    ctx.arc(x, y, m.r, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawFlies() {
  for (const f of flies) {
    const x = cam.x + f.x;
    const y = cam.y + f.y;
    const flap = Math.sin(f.phase * 17);
    ctx.save();
    ctx.translate(x, y);
    const tilt = clamp(f.vx * 0.01, -0.5, 0.5);
    ctx.rotate(tilt);
    ctx.fillStyle = 'rgba(18,26,24,0.85)';
    ctx.beginPath();
    ctx.ellipse(0, 0, 1.3 * f.size, 0.8 * f.size, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(171,184,170,0.28)';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.ellipse(-0.2, -0.8, 1.5 * f.size, 0.5 + flap * 0.3, -0.5, 0, TAU);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(0.2, -0.8, 1.5 * f.size, 0.5 - flap * 0.3, 0.5, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }
}

function drawParticles(front) {
  for (const p of particles) {
    if ((p.kind === 'drop') !== front) continue;
    const k = clamp(p.life / p.max, 0, 1);
    if (p.kind === 'drop') {
      ctx.fillStyle = `rgba(169,194,181,${k * 0.6})`;
      ctx.fillRect(p.x, p.y, p.r, p.r * 1.4);
    } else {
      ctx.fillStyle = p.wet
        ? `rgba(97,111,103,${k * 0.24})`
        : `rgba(116,111,92,${k * 0.2})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (0.7 + (1 - k) * 0.8), 0, TAU);
      ctx.fill();
    }
  }
}

function drawRain(front) {
  const wind = (worldTime.wind || 0) * 0.55 + 17;
  ctx.save();
  for (const d of rain) {
    if ((d.z > 0.55) !== front) continue;
    const scale = 0.7 + d.z * 0.6;
    const len = d.len * scale;
    ctx.strokeStyle = `rgba(184,203,194,${d.a * (front ? 1 : 0.7)})`;
    ctx.lineWidth = d.z > 0.8 ? 1.05 : 0.65;
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x - wind * len * 0.045, d.y - len * 2.6);
    ctx.stroke();
  }
  ctx.restore();
}

function drawForegroundLedge() {
  const offset = -cam.x * 1.18;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-20, VH + 20);
  for (let x = -20; x <= VW + 20; x += 16) {
    const n = x - offset;
    const y = VH - 18 - hash(n * 0.013 + 4.2) * 16 - Math.sin(n * 0.027 + 1.3) * 5;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(VW + 20, VH + 20);
  ctx.closePath();
  ctx.fillStyle = 'rgba(7,12,9,0.92)';
  ctx.fill();

  ctx.strokeStyle = 'rgba(64,74,53,0.32)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  for (let x = -20; x <= VW + 20; x += 16) {
    const n = x - offset;
    const y = VH - 18 - hash(n * 0.013 + 4.2) * 16 - Math.sin(n * 0.027 + 1.3) * 5;
    if (x === -20) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // foreground reeds on the ledge
  for (let i = 0; i < 30; i++) {
    const n = i * 41 + offset * 0.6;
    const x = ((n % (VW + 80)) + VW + 80) % (VW + 80) - 40;
    const baseY = VH - 16 - hash(n * 0.013) * 16;
    const h = 10 + hash(n * 0.031) * 30;
    const sway = Math.sin(worldTime.t * 0.8 + n * 0.02) * 2;
    ctx.strokeStyle = 'rgba(7,13,9,0.9)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x, baseY);
    ctx.quadraticCurveTo(x + 2, baseY - h * 0.5, x + sway + (hash(n) - 0.5) * 7, baseY - h);
    ctx.stroke();
  }
  ctx.restore();
}

function drawForegroundGrass() {
  ctx.save();
  const sway = Math.sin(worldTime.t * 0.9) * 1.5;
  ctx.strokeStyle = 'rgba(10,17,14,0.86)';
  for (let i = 0; i < 46; i++) {
    const x = (i / 45) * (VW + 30) - 15 + Math.sin(i * 7.3) * 8;
    const h = 6 + hash(i * 3.7) * 17;
    ctx.lineWidth = 1 + hash(i * 1.9) * 1.4;
    ctx.beginPath();
    ctx.moveTo(x, VH + 2);
    ctx.quadraticCurveTo(x + 2, VH - h * 0.45, x + (hash(i * 2.3) - 0.5) * 9 + sway, VH - h);
    ctx.stroke();
  }

  // dark framing reeds in the lower corners
  for (const side of [0, 1]) {
    const baseX = side === 0 ? 0 : VW;
    const dir = side === 0 ? 1 : -1;
    for (let i = 0; i < 12; i++) {
      const x = baseX + dir * hash(i * 3.1) * 110;
      const h = 22 + hash(i * 5.7) * 74;
      const lean = (hash(i * 2.2) - 0.35) * 38 * dir;
      ctx.strokeStyle = `rgba(8,14,11,${0.7 + hash(i) * 0.2})`;
      ctx.lineWidth = 1.4 + hash(i * 1.3) * 2;
      ctx.beginPath();
      ctx.moveTo(x, VH + 4);
      ctx.quadraticCurveTo(x + lean * 0.2, VH - h * 0.55, x + lean + sway, VH - h);
      ctx.stroke();
      if (i % 3 === 0) {
        ctx.fillStyle = 'rgba(8,14,11,0.85)';
        ctx.beginPath();
        ctx.ellipse(x + lean * 0.65 + sway * 0.5, VH - h * 0.55, 7, 2.2, side ? -0.6 : 0.6, 0, TAU);
        ctx.fill();
      }
    }
  }

  ctx.fillStyle = 'rgba(8,13,12,0.45)';
  ctx.fillRect(0, VH - 2, VW, 2);
  ctx.restore();
}

function drawColorGrade() {
  ctx.save();
  ctx.globalCompositeOperation = 'soft-light';
  const g = ctx.createLinearGradient(0, 0, VW, VH);
  g.addColorStop(0, 'rgba(40,76,80,0.30)');
  g.addColorStop(0.55, 'rgba(205,178,134,0.16)');
  g.addColorStop(1, 'rgba(52,37,28,0.24)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);
  ctx.restore();
}

function drawScreenVignette() {
  const cx = VW / 2, cy = VH / 2;
  const g = ctx.createRadialGradient(cx, cy, VH * 0.28, cx, cy, VH * 0.86);
  g.addColorStop(0, 'rgba(6,12,10,0)');
  g.addColorStop(0.7, 'rgba(6,12,10,0.12)');
  g.addColorStop(1, 'rgba(5,10,9,0.56)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);

  const top = ctx.createLinearGradient(0, 0, 0, VH);
  top.addColorStop(0, 'rgba(168,196,188,0.08)');
  top.addColorStop(0.35, 'rgba(168,196,188,0)');
  top.addColorStop(1, 'rgba(8,12,10,0.18)');
  ctx.fillStyle = top;
  ctx.fillRect(0, 0, VW, VH);

  if (cam.flash > 0.01) {
    ctx.fillStyle = `rgba(214,231,222,${cam.flash * 0.18})`;
    ctx.fillRect(0, 0, VW, VH);
  }
}

// ======================================================================
//  the slugcat
//  a two-chunk physics core, a follow-through body path, cosmetic IK limbs,
//  a verlet tail, and a head that is really just a very good excuse for ears.
// ======================================================================

class Slugcat {
  constructor(opts = {}) {
    this.s = opts.scale ?? 1;
    this.isPlayer = !!opts.player;
    this.name = opts.name || 'slugcat';
    this.spawnX = opts.x ?? 0;
    this.spawnFacing = opts.facing ?? 1;
    this.tint = opts.tint || COL.fur;
    this.pup = !!opts.pup;
    this.speedScale = opts.speedScale ?? (this.pup ? 0.78 : 1);

    this.ride = 13.5 * this.s;
    this.N = 6;
    this.spacing = 2.6 * this.s;
    this.radii = [5.8, 7.6, 9.2, 10.3, 10.5, 9.4].map(r => r * this.s);
    this.legs = [];
    this.tail = [];
    this.history = [];
    this.spine = [];
    this.ears = [
      { side: -1, rot: -0.25, vel: 0, twitchIn: 4 + Math.random() * 5 },
      { side: 1, rot: -0.1, vel: 0, twitchIn: 3 + Math.random() * 6 },
    ];

    this.reset(this.spawnX);
  }

  // -------------------------------------------------------------- reset

  reset(x) {
    const s = this.s;
    this.x = x;
    this.y = groundY(x) - this.ride;
    this.vx = 0;
    this.vy = 0;
    this.onGround = true;
    this.wasGrounded = true;
    this.support = { kind: 'ground' };
    this.floorY = groundY(x);
    this.facing = this.spawnFacing;
    this.facingTarget = this.facing;
    this.t = Math.random() * 10;

    this.jumpBuffer = 0;
    this.downBuffer = 0;
    this.jumpHeld = false;
    this.coyote = 0.1;
    this.sliding = false;
    this.slideT = 0;
    this.slideDust = 0;
    this.crouch = 0;
    this.squash = 0;
    this.squashVel = 0;
    this.standBlend = 1;
    this.bob = 0;
    this.bobVel = 0;
    this.airMeter = 0;
    this.flail = 0;
    this.act = 0;
    this.idleTimer = 1;
    this.idleBlend = 1;
    this.wigglePhase = Math.random() * TAU;

    this.landedThisTick = false;
    this.dustTimer = 0;

    this.blinkIn = 1.5 + Math.random() * 3;
    this.blinkT = 0;
    this.blink = 0;
    this.squeakT = 0;
    this.shakeIn = 6 + Math.random() * 9;
    this.shakeT = 0;
    this.shakeDust = 0;

    this.look = { x: x + this.facing * 60, y: this.y - 8 };
    this.gazeX = 0;
    this.gazeY = 0;
    this.headTilt = -0.08;

    this.history = [];
    for (let i = 0; i < 240; i++) {
      this.history.push({ x: x - this.facing * i, y: this.y });
    }

    this.spine = [];
    for (let i = 0; i < this.N; i++) {
      const u = i / (this.N - 1);
      this.spine.push({
        x: x + this.facing * lerp(4.5, -8.5, u) * s,
        y: this.y + lerp(-13.5, 3.5, u) * s - Math.sin(u * Math.PI) * 2.4 * s,
      });
    }

    this.head = {
      x: this.spine[0].x + this.facing * 4.6 * s,
      y: this.spine[0].y - 4.2 * s,
    };

    this.setupLegs();
    this.setupTail();
  }

  setupLegs() {
    const s = this.s;
    const defs = [
      { front: true,  far: false, anchor: 1, pair: 0, l1: 11.0, l2: 9.5, width: 2.2,  name: 'front near' },
      { front: true,  far: true,  anchor: 2, pair: 1, l1: 10.5, l2: 9.0, width: 1.9,  name: 'front far' },
      { front: false, far: true,  anchor: 4, pair: 0, l1: 9.5, l2: 8.5, width: 3.4,  name: 'hind far' },
      { front: false, far: false, anchor: 5, pair: 1, l1: 10.0, l2: 8.8, width: 3.8, name: 'hind near' },
    ];
    this.legs = defs.map(d => ({
      ...d,
      l1: d.l1 * s,
      l2: d.l2 * s,
      width: d.width * s,
      foot: { x: 0, y: 0 },
      knee: { x: 0, y: 0 },
      ikFoot: { x: 0, y: 0 },
      hip: { x: 0, y: 0 },
      step: null,
      footAngle: 0,
      cooldown: 0,
    }));

    // start with the front paws hanging under the chest and the hind feet
    // planted — the classic slugcat sit.
    for (const leg of this.legs) {
      const a = this.legAnchor(leg);
      leg.hip = a;
      if (leg.front) {
        leg.foot = {
          x: a.x + this.facing * (leg.far ? 1.2 : 3.0) * s,
          y: a.y + 15.8 * s,
        };
      } else {
        const fx = a.x + this.facing * (leg.far ? -3.6 : -1.5) * s;
        leg.foot = { x: fx, y: this.surfaceAt(fx) - 0.5 * s };
      }
      leg.footAngle = Math.atan2(groundY(leg.foot.x + 2) - groundY(leg.foot.x - 2), 4);
    }
    this.solveLegs();
  }

  legAnchor(leg) {
    const n = this.spine[leg.anchor] || this.spine[0];
    const s = this.s;
    let xOff, drop;
    if (leg.front) {
      xOff = leg.far ? 3.0 : 9.0;
      drop = leg.far ? 0.8 : 1.8;
    } else {
      xOff = leg.far ? -11.0 : -7.0;
      drop = leg.far ? 4.0 : 5.0;
    }
    return {
      x: n.x + this.facing * xOff * s,
      y: n.y + drop * s,
    };
  }

  setupTail() {
    const s = this.s;
    const base = this.spine[this.N - 1];
    this.tail = [];
    this.tailLen = 8;
    this.tailSeg = 3.8 * s;
    this.tailRadii = [];
    for (let i = 0; i < this.tailLen; i++) {
      const r = lerp(4.0, 0.6, Math.pow(i / (this.tailLen - 1), 0.72)) * s;
      this.tailRadii.push(r);
      const x = base.x - this.facing * (2.4 + i * 3.8) * s;
      const y = base.y + i * 0.7 * s;
      this.tail.push({ x, y, px: x, py: y });
    }
  }

  // ------------------------------------------------------------ utilities

  surfaceAt(x) {
    if (this.support && this.support.kind === 'platform') {
      const p = this.support.p;
      if (x > p.x - 2 && x < p.x + p.w + 2) return p.y;
    }
    return groundY(x);
  }

  setLook(x, y) {
    this.look.x = x;
    this.look.y = y;
  }

  get inAir() { return !this.onGround; }

  get stateName() {
    if (this.sliding) return 'slide';
    if (!this.onGround) return this.flail > 0.35 ? 'flail' : 'air';
    if (this.crouch > 0.5) return 'crouch';
    if (Math.abs(this.vx) > runSpeed * 0.72) return 'run';
    if (Math.abs(this.vx) > 7) return 'walk';
    if (this.idleBlend > 0.5) return 'idle';
    return 'settle';
  }

  // -------------------------------------------------------------- physics

  update(dt, ctrl) {
    const s = this.s;
    this.t += dt;
    this.landedThisTick = false;

    // a little input housekeeping
    if (ctrl.jumpPressed) this.jumpBuffer = 0.13;
    else this.jumpBuffer = Math.max(0, this.jumpBuffer - dt);
    if (ctrl.downPressed) this.downBuffer = 0.16;
    else this.downBuffer = Math.max(0, this.downBuffer - dt);
    this.coyote = this.onGround ? 0.1 : Math.max(0, this.coyote - dt);

    const move = clamp(ctrl.move || 0, -1, 1);
    if (move !== 0) {
      this.facing = sign(move);
      this.facingTarget = this.facing;
    }

    if (this.squeakT > 0) this.squeakT = Math.max(0, this.squeakT - dt);
    if (this.isPlayer && press.squeak) {
      press.squeak = false;
      this.squeakT = 0.28;
      audio.squeak();
      this.ears[0].vel += 2.2;
      this.ears[1].vel += 1.8;
    }

    // slide / belly slide — forgiving around ledges and landings
    if (!this.sliding && (this.onGround || this.coyote > 0) && Math.abs(this.vx) > walkSpeed * 1.1
        && (this.downBuffer > 0 || (ctrl.down && this.onGround))) {
      this.sliding = true;
      this.downBuffer = 0;
      this.slideT = 0.55 + clamp(Math.abs(this.vx) / 500, 0, 0.3);
      this.slideDust = 0;
      this.jumpBuffer = 0;
      if (this.isPlayer) audio.step(1.1, true);
      spawnSplash(this.x, this.floorY, 5, 0.8);
    }
    if (this.sliding) {
      this.slideT -= dt;
      if (this.slideT <= 0 || Math.abs(this.vx) < 38 || !this.onGround) {
        this.sliding = false;
      }
    }

    const wantCrouch = ctrl.down && this.onGround && !this.sliding && Math.abs(this.vx) < 55;
    this.crouch = damp(this.crouch, wantCrouch ? 1 : 0, 13, dt);

    // ground / air movement
    const slope = groundSlope(this.x);
    if (this.onGround) {
      if (this.sliding) {
        this.vx += slope * 300 * dt;
        this.vx *= 1 - 0.75 * dt;
        if (move !== 0 && sign(move) !== sign(this.vx)) this.vx = approach(this.vx, 0, 190 * dt);
        if (Math.abs(this.vx) < 38) this.sliding = false;
      } else {
        let max = (ctrl.sprint ? runSpeed : walkSpeed) * this.speedScale;
        if (this.crouch > 0.45) max = 40;
        if (move !== 0) {
          const target = move * max;
          let rate = 1050;
          if (sign(move) !== sign(this.vx) && Math.abs(this.vx) > 12) rate = 1850;
          this.vx = approach(this.vx, target, rate * dt);
          this.vx += slope * 240 * dt;
        } else {
          const friction = this.crouch > 0.4 ? 1500 : 1250;
          this.vx = approach(this.vx, 0, friction * dt);
        }
      }
    } else {
      if (move !== 0) {
        const target = move * (ctrl.sprint ? runSpeed * 1.02 : walkSpeed * 1.25) * this.speedScale;
        if (Math.abs(this.vx) < Math.abs(target) || sign(this.vx) !== sign(target)) {
          this.vx = approach(this.vx, target, 440 * dt);
        }
        this.vx += slope * 85 * dt;
      }
      this.vx *= 1 - 0.10 * dt;
    }

    if (!this.sliding) this.vx = clamp(this.vx, -runSpeed * 1.3, runSpeed * 1.3);

    // jump / variable jump height
    if (!ctrl.jump) {
      if (this.jumpHeld && this.vy < -95) this.vy *= 0.54;
      this.jumpHeld = false;
    }
    if (ctrl.jump) this.jumpHeld = true;

    if (this.jumpBuffer > 0 && (this.onGround || this.coyote > 0)) {
      let jumpVel = 300;
      if (this.sliding) {
        jumpVel = 328;
        this.vx += this.facing * 52;
        this.sliding = false;
      } else if (ctrl.sprint && Math.abs(this.vx) > 100) {
        jumpVel = 318;
      }
      this.vy = -jumpVel * (0.7 + 0.3 * s);
      this.vx += this.facing * (this.crouch > 0.4 ? 4 : 14);
      this.onGround = false;
      this.coyote = 0;
      this.jumpBuffer = 0;
      this.jumpHeld = true;
      this.airMeter = 0.35;
      this.squash = -0.22;
      this.squashVel = 0;
      this.flail = 0;
      spawnDust(this.x, this.floorY, 4, 0.8, true);
      spawnSplash(this.x, this.floorY, 3, 0.6);
      if (this.isPlayer) audio.jump();
    }

    // gravity
    let g = gravity;
    if (this.vy < 0 && ctrl.jump) g *= 0.73;
    if (this.vy > 0) g *= 1.08;
    this.vy += g * dt;
    this.vy = Math.min(this.vy, 940);

    // integrate
    this.x += this.vx * dt;
    const prevBottom = this.y + this.ride;
    this.y += this.vy * dt;
    const newBottom = this.y + this.ride;

    let floor = groundY(this.x);
    let supportPlatform = null;
    for (const p of platformsNear(this.x - 12 * s, this.x + 12 * s)) {
      if (this.x < p.x - 2 || this.x > p.x + p.w + 2) continue;
