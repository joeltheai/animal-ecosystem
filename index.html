<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slugcat — two-chunk rig</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b0a; overflow: hidden; }
  body { cursor: default; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script>
(() => {
'use strict';

// ======================================================================
//  slugcat — two-chunk rig study
//  One creature, a flat room, no scenery. The body is two physical
//  chunks; the head, limbs, ears and tail are cosmetic follow-through.
// ======================================================================

const TAU = Math.PI * 2;
const VW = 960;
const VH = 540;
const FLOOR = 412;

const RIDE = 22;
const BODY_LEN = 34;
const HEAD_R = 15.5;
const UPPER_R = 12.5;
const HIP_R = 16;

const ZOOM = 2.4;
const FLOOR_SCREEN = 410;

const WALK = 72;
const RUN = 146;
const GRAVITY = 1600;

const COL = {
  bg: '#0c1211',
  ground: '#080d0c',
  ink: '#07100d',
  body: '#f1eee1',
  bodyWarm: '#e5e1d4',
  bridge: '#d5d2c5',
  far: '#7f8b83',
  farInk: '#19221e',
  eye: '#0a110f',
  floor: 'rgba(224,231,214,0.20)',
  tick: 'rgba(224,231,214,0.075)',
  tickStrong: 'rgba(224,231,214,0.16)',
  accent: '#d9c28b',
  moss: '#a9d7c2',
};

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, rate, dt) => lerp(a, b, 1 - Math.exp(-rate * dt));
const approach = (v, target, delta) => v < target ? Math.min(v + delta, target) : Math.max(v - delta, target);
const sign = v => v < 0 ? -1 : 1;

// ---------------------------------------------------------------- canvas

const screen = document.getElementById('screen');
const sctx = screen.getContext('2d', { alpha: false });
const off = document.createElement('canvas');
off.width = VW;
off.height = VH;
const ctx = off.getContext('2d');

const view = { scale: 1, ox: 0, oy: 0, dpr: 1, cssW: 0, cssH: 0, vx: 0, vy: 0, vw: 0, vh: 0 };

function resize() {
  const cssW = window.innerWidth;
  const cssH = window.innerHeight;
  const dpr = Math.min(2, window.devicePixelRatio || 1);

  screen.width = Math.max(1, Math.round(cssW * dpr));
  screen.height = Math.max(1, Math.round(cssH * dpr));
  screen.style.width = cssW + 'px';
  screen.style.height = cssH + 'px';

  view.dpr = dpr;
  view.cssW = cssW;
  view.cssH = cssH;
  view.scale = Math.min(screen.width / VW, screen.height / VH);
  view.ox = (screen.width - VW * view.scale) / 2;
  view.oy = (screen.height - VH * view.scale) / 2;
  view.vx = view.ox / dpr;
  view.vy = view.oy / dpr;
  view.vw = VW * view.scale / dpr;
  view.vh = VH * view.scale / dpr;

  sctx.imageSmoothingEnabled = true;
}
resize();
window.addEventListener('resize', resize);

// ---------------------------------------------------------------- input

const keys = Object.create(null);
const press = { jump: false };
const ui = { hud: true };

const JUMP_KEYS = new Set(['Space', 'KeyW', 'ArrowUp']);
const MOVE_KEYS = new Set(['KeyA', 'KeyD', 'ArrowLeft', 'ArrowRight', 'Space', 'ArrowUp', 'ArrowDown']);

window.addEventListener('keydown', e => {
  if (MOVE_KEYS.has(e.code)) e.preventDefault();
  if (!e.repeat) {
    if (JUMP_KEYS.has(e.code)) press.jump = true;
    if (e.code === 'KeyR') resetWorld();
    if (e.code === 'KeyH') ui.hud = !ui.hud;
    if (e.code === 'KeyF') {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    }
  }
  keys[e.code] = true;
});

window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ---------------------------------------------------------------- rig

class Slugcat {
  constructor() {
    this.legs = [
      { front: true,  far: false, group: 0, l1: 18, l2: 16, w1: 3.3, w2: 2.7 },
      { front: true,  far: true,  group: 1, l1: 17, l2: 15, w1: 3.0, w2: 2.4 },
      { front: false, far: true,  group: 0, l1: 15, l2: 13, w1: 5.0, w2: 4.2 },
      { front: false, far: false, group: 1, l1: 16, l2: 14, w1: 5.4, w2: 4.5 },
    ].map(l => ({
      ...l,
      foot: { x: 0, y: 0 },
      ikFoot: { x: 0, y: 0 },
      knee: { x: 0, y: 0 },
      hip: { x: 0, y: 0 },
      step: null,
      cooldown: 0,
    }));

    this.reset();
  }

  reset() {
    this.x = 0;
    this.y = FLOOR - RIDE;
    this.vx = 0;
    this.vy = 0;
    this.facing = 1;
    this.grounded = true;
    this.coyote = 0.1;
    this.jumpBuffer = 0;
    this.jumpHeld = false;
    this.stand = 1;
    this.idleTimer = 1;
    this.spine = 1.22;
    this.spineVel = 0;
    this.bob = 0;
    this.bobVel = 0;
    this.squash = 0;
    this.squashVel = 0;
    this.breath = 0;
    this.act = 0;
    this.airMeter = 0;
    this.flail = 0;
    this.t = Math.random() * 10;
    this.justLanded = false;
    this.lastStepGroup = -1;
    this.groupCooldown = 0;

    this.headTilt = 0;
    this.blinkIn = 1.6 + Math.random() * 3;
    this.blinkT = 0;
    this.blink = 0;
    this.earTilt = 0;
    this.earVel = 0;

    this.tail = [];
    this.tailLen = 9;
    this.tailRadii = [];
    for (let i = 0; i < this.tailLen; i++) {
      const r = lerp(6.0, 0.9, Math.pow(i / (this.tailLen - 1), 0.8));
      this.tailRadii.push(r);
      this.tail.push({ x: 0, y: 0, px: 0, py: 0 });
    }

    this.coreHip = { x: 0, y: 0 };
    this.coreChest = { x: 0, y: 0 };
    this.computeCore();
    this.headX = this.coreChest.x + this.facing * 15;
    this.headY = this.coreChest.y - 10;
    this.placeFeet();
    this.resetTail();
  }

  // ------------------------------------------------------------- core

  computeCore() {
    this.breath = Math.sin(this.t * 2.05) * 0.45 * (1 - this.act * 0.55) * (this.grounded ? 1 : 0.25);
    const bodyY = this.y + this.bob;
    this.coreHip.x = this.x;
    this.coreHip.y = bodyY;
    this.coreChest.x = this.x + this.facing * BODY_LEN * Math.cos(this.spine);
    this.coreChest.y = bodyY - BODY_LEN * Math.sin(this.spine) - this.breath;
  }

  legAnchor(leg) {
    if (leg.front) {
      return {
        x: this.coreChest.x - this.facing * (2 + (leg.far ? 2.2 : 0)) + (leg.far ? -1 : 1),
        y: this.coreChest.y + UPPER_R * 0.55 + (leg.far ? -2 : 2),
      };
    }
    return {
      x: this.coreHip.x - this.facing * (2 + (leg.far ? 2.2 : 0)) + (leg.far ? -1 : 1),
      y: this.coreHip.y + HIP_R * 0.42 + (leg.far ? -2 : 2),
    };
  }

  groundHome(leg, anchor) {
    const speed = Math.abs(this.vx);
    const side = this.facing * (leg.far ? -4.5 : 4.5);
    if (leg.front) {
      return {
        x: anchor.x + this.facing * (10 + this.act * 10) + side,
        y: FLOOR - 1.5,
      };
    }
    return {
      x: anchor.x - this.facing * (1.5 - this.act * 2.5) + side,
      y: FLOOR - 1.5,
    };
  }

  frontHang(leg, anchor) {
    const sway = Math.sin(this.t * 1.35 + (leg.far ? 1.8 : 0)) * (0.6 + this.act * 1.4);
    return {
      x: anchor.x + this.facing * ((leg.far ? 8 : 13) + sway),
      y: anchor.y + 20 + (leg.far ? -1 : 1),
    };
  }

  airTarget(leg, anchor) {
    const flail = this.flail;
    const wobble = Math.sin(this.t * 8.5 + (leg.front ? 0 : 2.4) + (leg.far ? 1.7 : 0));
    if (leg.front) {
      let tx = anchor.x + this.facing * (2 + flail * (4 + wobble * 5));
      let ty = anchor.y + 14 + flail * (12 + Math.cos(this.t * 7 + 1) * 5);
      if (flail > 0.04) {
        const px = anchor.x + this.facing * (12 + flail * 22);
        const py = FLOOR - 2;
        const dx = px - anchor.x, dy = py - anchor.y;
        if (Math.hypot(dx, dy) < (leg.l1 + leg.l2) * 0.93) {
          tx = lerp(tx, px, flail * 0.8);
          ty = lerp(ty, py, flail * 0.75);
        }
      }
      return { x: tx, y: ty };
    }
    return {
      x: anchor.x - this.facing * (2 + flail * (8 - wobble * 4)),
      y: anchor.y + 13 + flail * (7 + wobble * 4),
    };
  }

  placeFeet() {
    this.computeCore();
    for (const leg of this.legs) {
      const a = this.legAnchor(leg);
      leg.hip = a;
      leg.step = null;
      leg.cooldown = 0;
      if (!this.grounded) {
        const t = this.airTarget(leg, a);
        leg.foot.x = t.x;
        leg.foot.y = t.y;
      } else if (leg.front && this.stand > 0.42) {
        const t = this.frontHang(leg, a);
        leg.foot.x = t.x;
        leg.foot.y = t.y;
      } else {
        const t = this.groundHome(leg, a);
        leg.foot.x = t.x;
        leg.foot.y = t.y;
      }
      this.solveLeg(leg);
    }
  }

  resetTail() {
    const ax = this.coreHip.x - this.facing * (HIP_R * 0.72);
    const ay = this.coreHip.y + HIP_R * 0.42;
    for (let i = 0; i < this.tailLen; i++) {
      const n = this.tail[i];
      n.x = ax - this.facing * i * 6.3;
      n.y = ay + i * 0.45;
      n.px = n.x;
      n.py = n.y;
    }
  }

  // ------------------------------------------------------------- update

  update(dt, ctrl) {
    this.t += dt;
    this.justLanded = false;

    if (ctrl.jumpPressed) this.jumpBuffer = 0.13;
    else this.jumpBuffer = Math.max(0, this.jumpBuffer - dt);
    this.coyote = this.grounded ? 0.1 : Math.max(0, this.coyote - dt);

    const move = clamp(ctrl.move || 0, -1, 1);
    if (move !== 0) {
      this.facing = sign(move);
    }

    // horizontal motion
    const maxSpeed = ctrl.sprint ? RUN : WALK;
    if (this.grounded) {
      if (move !== 0) {
        const target = move * maxSpeed;
        const skid = sign(move) !== sign(this.vx) && Math.abs(this.vx) > 12;
        this.vx = approach(this.vx, target, (skid ? 2100 : 1450) * dt);
      } else {
        this.vx = approach(this.vx, 0, 1900 * dt);
      }
    } else {
      if (move !== 0) {
        const target = move * RUN * 0.96;
        if (Math.abs(this.vx) < Math.abs(target) || sign(this.vx) !== sign(target)) {
          this.vx = approach(this.vx, target, 480 * dt);
        }
      }
      this.vx *= 1 - 0.08 * dt;
    }
    this.vx = clamp(this.vx, -RUN * 1.2, RUN * 1.2);
    this.x += this.vx * dt;

    // jump
    if (!ctrl.jump) {
      if (this.jumpHeld && this.vy < -90) this.vy *= 0.54;
      this.jumpHeld = false;
    }
    if (ctrl.jump) this.jumpHeld = true;

    if (this.jumpBuffer > 0 && (this.grounded || this.coyote > 0)) {
      this.vy = -(ctrl.sprint ? 430 : 382);
      this.vx += this.facing * (ctrl.sprint ? 24 : 10);
      this.grounded = false;
      this.coyote = 0;
      this.jumpBuffer = 0;
      this.jumpHeld = true;
      this.airMeter = 0.12;
      this.flail = 0;
      this.squash = -0.18;
      this.squashVel = 0;
      this.spineVel -= 0.9 + (ctrl.sprint ? 0.9 : 0);
      this.bobVel = 0;
      this.idleTimer = 0;
    }

    // vertical motion
    if (!this.grounded) {
      let g = GRAVITY;
      if (this.vy < 0 && ctrl.jump) g *= 0.72;
      if (this.vy > 0) g *= 1.12;
      this.vy = Math.min(this.vy + g * dt, 1250);
      this.y += this.vy * dt;

      if (this.y >= FLOOR - RIDE) {
        const impact = this.vy;
        this.y = FLOOR - RIDE;
        this.vy = 0;
        this.grounded = true;
        this.coyote = 0;
        this.airMeter = 0;
        this.flail = 0;
        this.stand = 0;
        this.idleTimer = 0;
        this.squash = clamp(impact / 760, 0.1, 0.9);
        this.squashVel = 0;
        this.bobVel += clamp(impact / 820, 0, 1.3) * 1.8;
        this.spineVel += this.facing * 0.18;
        this.justLanded = true;
      }
    } else {
      this.y = FLOOR - RIDE;
    }

    // idle / standing
    if (this.grounded && Math.abs(this.vx) < 7 && move === 0) this.idleTimer += dt;
    else this.idleTimer = 0;
    let standTarget = this.grounded ? smoothstep(clamp((this.idleTimer - 0.28) / 0.55, 0, 1)) : 0;
    this.stand = damp(this.stand, standTarget, 7, dt);

    this.act = damp(this.act, clamp(Math.abs(this.vx) / RUN, 0, 1), 7, dt);

    // air-time flail
    if (!this.grounded) {
      this.airMeter += dt * (0.7 + Math.abs(this.vy) / 620 + Math.abs(this.vx) / 260);
    } else {
      this.airMeter = Math.max(0, this.airMeter - dt * 4);
    }
    const flailTarget = smoothstep(clamp((this.airMeter - 0.9) / 1.0, 0, 1));
    this.flail = damp(this.flail, flailTarget, 8, dt);

    // spine: crawl when moving, sit up when idle, loosen in the air
    let target;
    let stiff;
    let damping;
    if (this.grounded) {
      const crawl = 0.34 - this.act * 0.085;
      target = lerp(crawl, 1.22, this.stand);
      target += Math.sin(this.t * 1.7) * 0.012 * (1 - this.act) * this.stand;
      stiff = 75;
      damping = 12;
    } else {
      target = 0.57 - clamp(this.vy * 0.00052, -0.38, 0.38) + this.act * 0.08;
      stiff = 22;
      damping = 4.5;
    }
    this.spineVel += ((target - this.spine) * stiff - this.spineVel * damping) * dt;
    this.spine = clamp(this.spine + this.spineVel * dt, -0.32, 1.72);

    // body bob + squash springs
    this.bobVel += (-this.bob * 170 - this.bobVel * 20) * dt;
    this.bob = clamp(this.bob + this.bobVel * dt, -6, 9);
    this.squashVel += (-this.squash * 120 - this.squashVel * 13) * dt;
    this.squash = clamp(this.squash + this.squashVel * dt, -0.32, 1);

    this.computeCore();
    if (this.justLanded) this.placeFeet();

    const headTX = this.coreChest.x + this.facing * lerp(15, 8, this.stand);
    const headTY = this.coreChest.y - lerp(10, 18, this.stand);
    this.headX = damp(this.headX, headTX, 24, dt);
    this.headY = damp(this.headY, headTY, 22, dt);

    this.updateLegs(dt);
    this.updateTail(dt);
    this.updateFace(dt);
  }

  // ------------------------------------------------------------- legs

  updateLegs(dt) {
    for (const leg of this.legs) this.updateLeg(leg, dt);
    this.scheduleGait(dt);
  }

  updateLeg(leg, dt) {
    const a = this.legAnchor(leg);
    leg.hip = a;
    leg.cooldown = Math.max(0, leg.cooldown - dt);
    leg.stepHome = null;
    leg.stepErr = 0;
    leg.stepThreshold = 0;

    if (!this.grounded) {
      leg.step = null;
      const t = this.airTarget(leg, a);
      leg.foot.x = damp(leg.foot.x, t.x, 10, dt);
      leg.foot.y = damp(leg.foot.y, t.y, 10, dt);
      this.solveLeg(leg);
      return;
    }

    const lift = leg.front ? smoothstep(clamp((this.stand - 0.12) / 0.48, 0, 1)) : 0;
    if (lift > 0.02) {
      leg.step = null;
      const ground = this.groundHome(leg, a);
      const hang = this.frontHang(leg, a);
      const tx = lerp(ground.x, hang.x, lift);
      const ty = lerp(ground.y, hang.y, lift);
      leg.foot.x = damp(leg.foot.x, tx, 12, dt);
      leg.foot.y = damp(leg.foot.y, ty, 12, dt);
      this.solveLeg(leg);
      return;
    }

    const home = this.groundHome(leg, a);
    const speed = Math.abs(this.vx);
    const err = Math.hypot(leg.foot.x - home.x, (leg.foot.y - home.y) * 0.7);
    const threshold = 5.5 + speed * 0.018;
    leg.stepHome = home;
    leg.stepErr = err;
    leg.stepThreshold = threshold;

    if (leg.step) {
      leg.step.t += dt;
      const k = clamp(leg.step.t / leg.step.dur, 0, 1);
      const e = k * k * (3 - 2 * k);
      leg.foot.x = lerp(leg.step.from.x, leg.step.to.x, e);
      leg.foot.y = lerp(leg.step.from.y, leg.step.to.y, e) - Math.sin(Math.PI * k) * leg.step.lift;
      if (k >= 1) {
        leg.foot.x = leg.step.to.x;
        leg.foot.y = leg.step.to.y;
        leg.step = null;
        leg.cooldown = 0.025 + Math.random() * 0.03;
        this.bobVel += 0.45 + this.act * 0.7;
      }
    }

    this.solveLeg(leg);
  }

  scheduleGait(dt) {
    this.groupCooldown = Math.max(0, this.groupCooldown - dt);
    if (!this.grounded || this.legs.some(l => l.step) || this.groupCooldown > 0) return;
    const speed = Math.abs(this.vx);
    if (speed < 2) return;

    const groups = [0, 1].map(g => {
      const legs = this.legs.filter(l => l.group === g && l.stepHome);
      let maxErr = 0;
      let maxThreshold = 0;
      for (const l of legs) {
        maxErr = Math.max(maxErr, l.stepErr);
        maxThreshold = Math.max(maxThreshold, l.stepThreshold);
      }
      return { g, legs, maxErr, maxThreshold };
    });

    const ready = groups.filter(x => x.legs.length && x.maxErr > x.maxThreshold * 0.88);
    if (!ready.length) return;

    let chosen = null;
    if (this.lastStepGroup >= 0) {
      const other = ready.find(x => x.g !== this.lastStepGroup);
      const same = ready.find(x => x.g === this.lastStepGroup);
      chosen = other && (other.maxErr > other.maxThreshold * 0.55 || !same) ? other : (same || other);
    } else {
      chosen = ready.slice().sort((a, b) => b.maxErr - a.maxErr)[0];
    }
    if (!chosen) return;

    let started = 0;
    for (const leg of chosen.legs) {
      if (!leg.step && leg.cooldown <= 0) {
        this.startStep(leg, leg.hip, leg.stepHome, speed);
        this.solveLeg(leg);
        started++;
      }
    }
    if (started) {
      this.lastStepGroup = chosen.g;
      this.groupCooldown = 0.05;
    }
  }

  startStep(leg, anchor, home, speed) {
    const dur = clamp(0.19 - this.act * 0.085, 0.095, 0.2);
    const lead = (leg.front ? 6 : 4) + speed * dur * 0.85;
    let tx = home.x + this.facing * lead;
    const ty = FLOOR - 1.5;
    const maxReach = (leg.l1 + leg.l2) * 0.92;
    const dy = ty - anchor.y;
    if (dy < maxReach) {
      const maxDx = Math.sqrt(Math.max(0, maxReach * maxReach - dy * dy));
      tx = anchor.x + clamp(tx - anchor.x, -maxDx, maxDx);
    }
    const dx = tx - leg.foot.x;
    const dist = Math.hypot(dx, ty - leg.foot.y);
    leg.step = {
      from: { x: leg.foot.x, y: leg.foot.y },
      to: { x: tx, y: ty },
      t: 0,
      dur,
      lift: 4 + Math.min(10, dist * 0.28) + this.act * 2,
    };
    leg.cooldown = 0.02 + Math.random() * 0.025;
  }

  solveLeg(leg) {
    const bend = (leg.front ? 1 : -1) * this.facing;
    const res = solveIK(
      leg.hip.x, leg.hip.y,
      leg.foot.x, leg.foot.y,
      leg.l1, leg.l2,
      bend
    );
    leg.knee = res.knee;
    leg.ikFoot = res.foot;
  }

  // ------------------------------------------------------------- tail

  updateTail(dt) {
    const t = this.tail;
    const ax = this.coreHip.x - this.facing * (HIP_R * 0.72);
    const ay = this.coreHip.y + HIP_R * 0.42;

    t[0].x = ax;
    t[0].y = ay;
    t[0].px = ax;
    t[0].py = ay;

    const retain = Math.pow(0.5, dt);
    const dt2 = dt * dt;
    const idle = this.stand;
    for (let i = 1; i < this.tailLen; i++) {
      const n = t[i];
      const vx = (n.x - n.px) * retain;
      const vy = (n.y - n.py) * retain;
      n.px = n.x;
      n.py = n.y;

      const gravity = (this.grounded ? 620 : 180) * (0.8 + i / this.tailLen * 0.4);
      const curl = idle * Math.pow(i / this.tailLen, 1.4);
      const sway = Math.sin(this.t * 1.35 + i * 0.62) * 34 * curl;
      const wag = Math.sin(this.t * 2.0 + i * 0.9) * (6 + Math.abs(this.vx) * 0.04);

      n.x += vx + (sway + wag) * dt2;
      n.y += vy + (gravity - 200 * curl) * dt2;

      const fy = FLOOR - this.tailRadii[i] * 0.8;
      if (n.y > fy) {
        n.y = fy;
        n.px = lerp(n.px, n.x, 0.35);
        n.py = lerp(n.py, n.y, 0.35);
      }
    }

    for (let iter = 0; iter < 3; iter++) {
      for (let i = 1; i < this.tailLen; i++) {
        const a = t[i - 1], b = t[i];
        let dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.0001;
        const diff = (d - 6.3) / d;
        if (i === 1) {
          b.x -= dx * diff; b.y -= dy * diff;
        } else {
          a.x += dx * diff * 0.5; a.y += dy * diff * 0.5;
          b.x -= dx * diff * 0.5; b.y -= dy * diff * 0.5;
        }
      }
      for (let i = 1; i < this.tailLen - 1; i++) {
        const a = t[i - 1], b = t[i], c = t[i + 1];
        const k = 0.16 * (1 - i / this.tailLen);
        b.x += ((a.x + c.x) * 0.5 - b.x) * k;
        b.y += ((a.y + c.y) * 0.5 - b.y) * k;
      }
      for (let i = 1; i < this.tailLen; i++) {
        const n = t[i];
        const fy = FLOOR - this.tailRadii[i] * 0.8;
        if (n.y > fy) n.y = fy;
      }
    }

    // an idle tail curls up off the floor
    if (idle > 0.02 && this.grounded) {
      const base = t[0];
      for (let i = 1; i < this.tailLen; i++) {
        const n = t[i];
        const u = i / (this.tailLen - 1);
        const tx = base.x - this.facing * i * 6.3 + Math.sin(this.t * 1.1 + i * 0.5) * 1.4 * idle;
        const ty = base.y + 1 + i * 0.5 - u * u * 17 * idle;
        const fy = FLOOR - this.tailRadii[i] * 0.8;
        n.x = lerp(n.x, tx, 0.035 * idle);
        n.y = lerp(n.y, Math.min(ty, fy), 0.035 * idle);
      }
      for (let i = 1; i < this.tailLen; i++) {
        const a = t[i - 1], b = t[i];
        let dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.0001;
        const diff = (d - 6.3) / d;
        if (i === 1) { b.x -= dx * diff; b.y -= dy * diff; }
        else { a.x += dx * diff * 0.5; a.y += dy * diff * 0.5; b.x -= dx * diff * 0.5; b.y -= dy * diff * 0.5; }
      }
    }
  }

  // ------------------------------------------------------------- face

  updateFace(dt) {
    this.blinkIn -= dt;
    if (this.blinkIn <= 0) {
      this.blinkT = 0.12;
      this.blinkIn = 2.5 + Math.random() * 4.5;
    }
    if (this.blinkT > 0) this.blinkT -= dt;
    this.blink = this.blinkT > 0 ? Math.sin(clamp(1 - this.blinkT / 0.12, 0, 1) * Math.PI) : 0;

    const targetEar = clamp(
      this.vx * this.facing * 0.00009
      + this.flail * 0.35
      + Math.sin(this.t * 0.8) * 0.015,
      -0.28, 0.45
    );
    this.earVel += ((targetEar - this.earTilt) * 90 - this.earVel * 12) * dt;
    this.earTilt = clamp(this.earTilt + this.earVel * dt, -0.5, 0.6);

    const targetHeadTilt = clamp(
      this.vy * 0.00022
      + Math.sin(this.t * 1.9) * 0.01 * (1 - this.act)
      + this.flail * 0.12,
      -0.22, 0.24
    );
    this.headTilt = damp(this.headTilt, targetHeadTilt, 7, dt);
  }

  // ------------------------------------------------------------- draw

  draw(ctx) {
    ctx.save();

    // squash around the floor line
    const px = this.x;
    const py = FLOOR;
    ctx.translate(px, py);
    ctx.scale(1 + this.squash * 0.14, 1 - this.squash * 0.18);
    ctx.translate(-px, -py);

    this.drawTail(ctx);
    for (const leg of this.legs) if (leg.far) this.drawLeg(ctx, leg);
    this.drawBody(ctx);
    for (const leg of this.legs) if (!leg.far) this.drawLeg(ctx, leg);
    this.drawHead(ctx);

    ctx.restore();
  }

  drawBody(ctx) {
    const hip = this.coreHip;
    const chest = this.coreChest;
    const dx = chest.x - hip.x;
    const dy = chest.y - hip.y;
    const len = Math.hypot(dx, dy) || 1;
    const nx = dy / len;
    const ny = -dx / len;

    // the torso is a short chain of overlapping circles (a paper doll
    // over the two physics chunks). The dark pass gives one outer edge.
    const n = 7;
    const circles = [];
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      const arch = Math.sin(Math.PI * t) * 2.2 * (1 - this.stand * 0.45);
      const r = lerp(HIP_R, UPPER_R, t) + Math.sin(Math.PI * t) * 2.0;
      circles.push({
        x: lerp(hip.x, chest.x, t) + nx * arch,
        y: lerp(hip.y, chest.y, t) + ny * arch,
        r,
      });
    }

    ctx.fillStyle = COL.ink;
    for (const c of circles) {
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r + 2.4, 0, TAU);
      ctx.fill();
    }

    ctx.fillStyle = COL.body;
    for (const c of circles) {
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, TAU);
      ctx.fill();
    }

    // tiny joint shadows where the limbs meet the body
    for (const leg of this.legs) {
      if (leg.far) continue;
      const a = leg.hip;
      ctx.fillStyle = 'rgba(7,16,13,0.14)';
      ctx.beginPath();
      ctx.arc(a.x, a.y, leg.front ? 4.2 : 5.4, 0, TAU);
      ctx.fill();
    }
  }

  drawHead(ctx) {
    const hx = this.headX;
    const hy = this.headY;

    ctx.save();
    ctx.translate(hx, hy);
    ctx.scale(this.facing, 1);
    ctx.rotate(this.headTilt);

    // head
    this.circle(ctx, 0, 0, HEAD_R, COL.body, COL.ink, 2.5);

    // ears, both visible on the head rim
    this.drawEar(ctx, -8.5, -HEAD_R * 0.8, 4.8, 2.1, true);
    this.drawEar(ctx, 8.0, -HEAD_R * 0.82, 5.4, 2.5, false);

    // eyes
    const open = clamp(1 - this.blink * 0.96, 0, 1);
    const near = { x: HEAD_R * 0.45, y: -2.2, rx: 2.9, ry: 4.0 * open };
    const far = { x: HEAD_R * 0.14, y: -4.7, rx: 2.3, ry: 3.2 * open };

    ctx.fillStyle = COL.eye;
    ctx.beginPath();
    ctx.ellipse(far.x, far.y, far.rx, Math.max(0.25, far.ry), 0, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(near.x, near.y, near.rx, Math.max(0.25, near.ry), 0, 0, TAU);
    ctx.fill();

    if (open > 0.25) {
      ctx.fillStyle = 'rgba(255,252,236,0.55)';
      ctx.beginPath();
      ctx.arc(near.x - 0.9, near.y - near.ry * 0.38, 0.8, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(far.x - 0.7, far.y - far.ry * 0.38, 0.6, 0, TAU);
      ctx.fill();
    }

    // nose
    ctx.fillStyle = COL.eye;
    ctx.beginPath();
    ctx.ellipse(HEAD_R * 0.92, 3.4, 1.7, 1.25, -0.12, 0, TAU);
    ctx.fill();

    ctx.restore();
  }

  drawEar(ctx, x, y, r, inner, far) {
    const flop = this.earTilt + (far ? -0.08 : 0.05);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(flop);
    this.circle(ctx, 0, 0, r, far ? COL.bodyWarm : COL.body, far ? COL.farInk : COL.ink, far ? 1.6 : 1.9);
    // a quiet inner crease, not a pupil
    ctx.strokeStyle = far ? 'rgba(53,64,58,0.35)' : 'rgba(53,64,58,0.45)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.arc(0, -0.6, inner, Math.PI * 0.2, Math.PI * 0.8);
    ctx.stroke();
    ctx.restore();
  }

  drawLeg(ctx, leg) {
    const a = leg.hip;
    const k = leg.knee;
    const f = leg.ikFoot;
    const far = leg.far;
    const fill = far ? COL.far : COL.bodyWarm;
    const ink = far ? COL.farInk : COL.ink;
    const w1 = leg.w1;
    const w2 = leg.w2;

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // outline pass
    ctx.strokeStyle = ink;
    ctx.lineWidth = w1 + 2;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(k.x, k.y);
    ctx.stroke();
    ctx.lineWidth = w2 + 1.7;
    ctx.beginPath();
    ctx.moveTo(k.x, k.y);
    ctx.lineTo(f.x, f.y);
    ctx.stroke();

    // fill pass
    ctx.strokeStyle = fill;
    ctx.lineWidth = w1;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(k.x, k.y);
    ctx.stroke();
    ctx.lineWidth = w2;
    ctx.beginPath();
    ctx.moveTo(k.x, k.y);
    ctx.lineTo(f.x, f.y);
    ctx.stroke();

    // joint and paw
    ctx.fillStyle = fill;
    ctx.strokeStyle = ink;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(k.x, k.y, w2 * 0.55, 0, TAU);
    ctx.fill();
    ctx.stroke();

    const paw = leg.front ? 4.7 : 5.3;
    ctx.beginPath();
    ctx.arc(f.x, f.y, paw, 0, TAU);
    ctx.fill();
    ctx.stroke();

    // a darker socket circle for the near limb
    if (!far) {
      ctx.fillStyle = 'rgba(7,16,13,0.32)';
      ctx.beginPath();
      ctx.arc(a.x, a.y, 2.4, 0, TAU);
      ctx.fill();
    }
  }

  drawTail(ctx) {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // cosmetic wave on top of the verlet chain
    const pts = [];
    for (let i = 0; i < this.tailLen; i++) {
      const n = this.tail[i];
      const u = i / (this.tailLen - 1);
      const wave = Math.sin(this.t * 5.4 + i * 0.55) * (0.8 + this.act * 2.4 + this.stand * 1.2) * u;
      const slow = Math.sin(this.t * 1.4 + i * 0.5) * 1.1 * this.stand * u;
      const lift = Math.pow(u, 1.5) * (this.act * 4.5 + this.stand * 9.0);
      pts.push({ x: n.x + wave + slow, y: n.y - lift });
    }

    for (let i = 1; i < this.tailLen; i++) {
      const a = pts[i - 1];
      const b = pts[i];
      ctx.strokeStyle = COL.ink;
      ctx.lineWidth = this.tailRadii[i - 1] + this.tailRadii[i] + 3;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
    for (let i = 1; i < this.tailLen; i++) {
      const a = pts[i - 1];
      const b = pts[i];
      ctx.strokeStyle = i > this.tailLen - 3 ? COL.bodyWarm : COL.body;
      ctx.lineWidth = this.tailRadii[i - 1] + this.tailRadii[i];
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }

    const n = pts[this.tailLen - 1];
    this.circle(ctx, n.x, n.y, this.tailRadii[this.tailLen - 1], COL.bodyWarm, COL.ink, 1.6);
  }

  drawShadow(ctx) {
    const height = Math.max(0, (FLOOR - RIDE) - this.y);
    const a = clamp(1 - height / 280, 0.18, 1);
    ctx.save();
    ctx.fillStyle = `rgba(0,0,0,${0.28 * a})`;
    ctx.beginPath();
    ctx.ellipse(this.x, FLOOR + 1, 64 * (0.7 + a * 0.3), 8 * (0.7 + a * 0.3), 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  circle(ctx, x, y, r, fill, stroke, lw) {
    ctx.fillStyle = fill;
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
    ctx.stroke();
  }

  stateName() {
    if (!this.grounded) return this.flail > 0.32 ? 'flail' : 'air';
    if (this.stand > 0.55 && Math.abs(this.vx) < 8) return 'stand';
    if (Math.abs(this.vx) > RUN * 0.78) return 'run';
    if (Math.abs(this.vx) > 7) return 'crawl';
    return 'settle';
  }
}

function solveIK(ax, ay, tx, ty, l1, l2, bend) {
  let dx = tx - ax;
  let dy = ty - ay;
  let d = Math.hypot(dx, dy) || 0.0001;
  const minD = Math.abs(l1 - l2) + 0.5;
  const maxD = l1 + l2 - 0.4;
  if (d < minD) {
    dx = dx / d * minD;
    dy = dy / d * minD;
    d = minD;
  } else if (d > maxD) {
    dx = dx / d * maxD;
    dy = dy / d * maxD;
    d = maxD;
  }
  tx = ax + dx;
  ty = ay + dy;
  const base = Math.atan2(dy, dx);
  const cosA = clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1);
  const a = Math.acos(cosA);
  const ang = base + bend * a;
  return {
    knee: { x: ax + Math.cos(ang) * l1, y: ay + Math.sin(ang) * l1 },
    foot: { x: tx, y: ty },
  };
}

// ---------------------------------------------------------------- game

const rig = new Slugcat();
const cam = { x: 0 };

function resetWorld() {
  rig.reset();
  cam.x = 0;
}

function tick(dt) {
  const ctrl = {
    move: ((keys.KeyD || keys.ArrowRight) ? 1 : 0) - ((keys.KeyA || keys.ArrowLeft) ? 1 : 0),
    jump: !!(keys.Space || keys.KeyW || keys.ArrowUp),
    jumpPressed: press.jump,
    sprint: !!(keys.ShiftLeft || keys.ShiftRight),
  };
  press.jump = false;

  rig.update(dt, ctrl);

  const targetCam = rig.x + rig.facing * 18 + clamp(rig.vx * 0.16, -38, 38);
  cam.x = damp(cam.x, targetCam, 4.2, dt);
}

// ---------------------------------------------------------------- render

function drawStage() {
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = COL.ground;
  ctx.fillRect(0, FLOOR_SCREEN, VW, VH - FLOOR_SCREEN);

  ctx.fillStyle = COL.floor;
  ctx.fillRect(0, FLOOR_SCREEN, VW, 1);

  // floor ticks show horizontal motion without adding a background
  const spacing = 64;
  const startX = Math.floor((cam.x - VW / ZOOM / 2) / spacing) * spacing;
  const endX = cam.x + VW / ZOOM / 2 + spacing;
  for (let x = startX; x < endX; x += spacing) {
    const sx = VW / 2 + (x - cam.x) * ZOOM;
    if (sx < -4 || sx > VW + 4) continue;
    const strong = Math.round(x / spacing) % 5 === 0;
    ctx.fillStyle = strong ? COL.tickStrong : COL.tick;
    ctx.fillRect(Math.round(sx), FLOOR_SCREEN, 1, strong ? 13 : 6);
  }
}

function drawHud() {
  if (!ui.hud) return;
  const dpr = view.dpr;
  const vx = view.vx;
  const vy = view.vy;
  const vw = view.vw;
  const vh = view.vh;
  if (vw < 240 || vh < 160) return;

  const sc = clamp(vh / 540, 0.9, 1.8);
  sctx.save();
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.textBaseline = 'alphabetic';
  sctx.textAlign = 'left';

  const pad = clamp(vw * 0.028, 16, 30) * sc;
  const left = vx + pad;
  const right = vx + vw - pad;
  const top = vy + pad;
  const bottom = vy + vh - pad;

  sctx.font = `600 ${12 * sc}px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace`;
  sctx.fillStyle = 'rgba(240,238,224,0.86)';
  drawSpaced('SLUGCAT', left, top + 12 * sc, 3.4 * sc);
  sctx.font = `400 ${7.4 * sc}px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace`;
  sctx.fillStyle = 'rgba(221,226,209,0.34)';
  drawSpaced('TWO-CHUNK PROCEDURAL RIG', left, top + 25 * sc, 1.2 * sc);

  const state = rig.stateName().toUpperCase();
  sctx.font = `600 ${8.4 * sc}px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace`;
  const air = !rig.grounded;
  sctx.fillStyle = air ? `rgba(217,194,139,0.92)` : 'rgba(169,215,194,0.78)';
  drawSpacedRight(state, right, top + 11 * sc, 1.7 * sc);

  sctx.fillStyle = 'rgba(211,224,207,0.12)';
  sctx.fillRect(right - 120 * sc, top + 20 * sc, 120 * sc, 1);

  sctx.font = `400 ${7.2 * sc}px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace`;
  sctx.fillStyle = 'rgba(216,224,208,0.32)';
  drawSpacedRight('A / D  MOVE     SHIFT  RUN     SPACE  JUMP', right, bottom - 4 * sc, 0.2 * sc);

  sctx.fillStyle = 'rgba(216,224,208,0.24)';
  drawSpaced('R RESET     H HUD     F FULLSCREEN', left, bottom - 4 * sc, 0.2 * sc);

  sctx.restore();
}

function drawSpaced(text, x, y, spacing) {
  let cx = x;
  for (const ch of text) {
    sctx.fillText(ch, cx, y);
    cx += sctx.measureText(ch).width + spacing;
  }
}

function drawSpacedRight(text, x, y, spacing) {
  let total = 0;
  for (const ch of text) total += sctx.measureText(ch).width + spacing;
  total -= spacing;
  let cx = x - total;
  for (const ch of text) {
    sctx.fillText(ch, cx, y);
    cx += sctx.measureText(ch).width + spacing;
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  drawStage();

  // flat room, camera only moves horizontally
  ctx.save();
  ctx.setTransform(
    ZOOM, 0, 0, ZOOM,
    VW / 2 - cam.x * ZOOM,
    FLOOR_SCREEN - FLOOR * ZOOM
  );

  rig.drawShadow(ctx);
  rig.draw(ctx);

  ctx.restore();

  sctx.setTransform(1, 0, 0, 1, 0, 0);
  sctx.imageSmoothingEnabled = true;
  sctx.fillStyle = '#070b0a';
  sctx.fillRect(0, 0, screen.width, screen.height);
  sctx.drawImage(off, view.ox, view.oy, VW * view.scale, VH * view.scale);

  drawHud();
}

// ---------------------------------------------------------------- loop

let last = performance.now();
let acc = 0;
const STEP = 1 / 120;

function frame(now) {
  const raw = Math.min(0.05, (now - last) / 1000);
  last = now;
  acc += raw;
  let steps = 0;
  while (acc >= STEP && steps < 6) {
    tick(STEP);
    acc -= STEP;
    steps++;
  }
  if (steps === 6) acc = 0;
  render();
  requestAnimationFrame(frame);
}

// tiny handle for tinkering
window.__slug = { rig, cam, resetWorld };

requestAnimationFrame(frame);

})();
</script>
</body>
